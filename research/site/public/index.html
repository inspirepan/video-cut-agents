具调用返回成功只证明一次编辑操作跑通了。完成需要证据表明成片真实、连贯、技术合格、符合场景目标。时间线看着对但有未上报的工具错误，不算通过。", "source": "OpenChatCut/src/agent/skills/livestream-to-clips/references/qa-and-evaluation.md:3"}, {"title": "自修必须设轮次上限", "detail": "失败就改、改完再渲、渲完再评的循环，不设上限会一直转下去。video-use 封顶 3 轮自评，open-edit 的机械修复阶梯封顶 2 轮，超了就如实上报而不是继续循环。", "source": "video-use/SKILL.md:99"}, {"title": "不要发明没验证的限制", "detail": "写进规则文档的限制会被 Agent 无条件遵守。凭空加一条限制等于从每次运行中删掉真实能力。open-edit 用 probe render 判定每条引擎限制，文档漂移（文档与实现脱节）会让构建失败。", "source": "open-edit/pipeline/director-brief.md:193"}, {"title": "手写打分函数不如 LLM", "detail": "分层预计算 codec、tone tag、shot layer 这类工程属于过度设计。LLM 选片好过任何手调启发式；chatmonteur 的朴素语义切除器曾静默删掉 50 秒里的 28 秒。", "source": "video-use/SKILL.md:311"}], "refs": [{"repo": "chatmonteur", "path": "chatmonteur/skills/references/engineering-facts.md", "line": 1, "why": "全仓库密度最高的实测事实表"}, {"repo": "kajisho5-ffmpeg-skill", "path": "kajisho5-ffmpeg-skill/SKILL.md", "line": 174, "why": "看起来对其实错的反模式清单"}, {"repo": "video-use", "path": "video-use/SKILL.md", "line": 18, "why": "不可违反的生产正确性硬规则"}], "children": [{"id": "pit-time", "title": "时间基准与帧", "tag": "pitfall", "summary": "VFR（可变帧率）、seek（跳转）偏差、PTS（显示时间戳）重置、source 与 output 时间混用", "goal": "时间码错一次，后面所有字幕、动效、事件标注全错，而且大多是静默失败。这是整条产线最脆的地方。", "atomic": [{"name": "VFR 判定", "impl": "r_frame_rate 与 avg_frame_rate 比对", "note": "不一致即按 VFR 处理，重编码加 -fps_mode cfr"}, {"name": "精确 seek", "impl": "-ss 放在 -i 之后", "note": "montaj 承认代价是长 HEVC 上 5-10 秒，但要的帧就是给的帧"}, {"name": "PTS 重置", "impl": "trim 后接 setpts=PTS-STARTPTS", "note": "atrim 后接 asetpts；跳切用 setpts=N/FRAME_RATE/TB"}, {"name": "时钟漂移校正", "impl": "kajisho5 sync.py --fix-drift", "note": "在重叠的尾部再测一次偏移，按 ppm（百万分之一）重采样"}, {"name": "输出时间轴换算", "impl": "output_time = word.start − segment_start + segment_offset", "note": "video-use 的公式，字幕唯一正确的偏移算法"}], "pitfalls": [{"title": "-ss 前后语义完全不同", "detail": "-ss 放在 -i 前是关键帧 seek：H.264 25fps 下关键帧（可独立解码的完整帧）可能每 10 秒才有一个，偏差可达数秒；放在 -i 之后才精确到帧。而且前置 seek 会把输出时间轴重置到裁剪点。", "source": "n0an-ffmpeg-skill/ffmpeg/references/glossary.md:91"}, {"title": "前置 seek 加 copy 丢首秒", "detail": "前置 -ss 与 -c:v copy 组合触发 FFmpeg 未修复缺陷（trac 8189），会丢掉输出第一秒；后置 -ss 加 copy 则让切点落在非关键帧上，开头出黑帧。", "source": "n0an-ffmpeg-skill/ffmpeg/references/encoding-and-tuning.md:142"}, {"title": "VFR 素材不重编码剪切会卡住开头", "detail": "手机和录屏素材几乎都是 VFR。对它们做 -c copy（不重编码）剪切，文件能播放，但开头画面卡住不动或显示错误的帧。kajisho5 在偏差超 0.5 秒时自动重编码。", "source": "kajisho5-ffmpeg-skill/SKILL.md:177"}, {"title": "不重置 PTS 静默错乱", "detail": "trim/atrim 后不接 setpts=PTS-STARTPTS，concat 会产出错误时长或音频漂移，而且不报错。这是滤镜链最常见的静默失败之一。", "source": "n0an-ffmpeg-skill/ffmpeg/references/glossary.md:56"}, {"title": "稀疏关键帧导致切短", "detail": "montaj 记录的真实事故：源片关键帧稀疏使 seek 越过目标，剪辑点被截短。修复方式是归一化预处理把关键帧压到每秒一个，并用 -t 而不是 -to。", "source": "montaj/docs/RENDER.md:547"}, {"title": "两套时基同框", "detail": "让合成引擎内嵌讲者视频时，图形跑合成引擎的时钟，烧录层（直接画进画面的字幕）跑视频自身的时钟。两个时基同框正是字幕差半秒的成因，而且静默失败。", "source": "chatmonteur/skills/references/engineering-facts.md:136"}, {"title": "转场偏移必须累积", "detail": "每次转场（镜头过渡）都会缩短时间线。xfade 的 offset 必须按已合成长度减去本次转场时长来计算；直接累加原始时长，会在每个接缝多漂一点。", "source": "chatmonteur/skills/references/engineering-facts.md:53"}], "interview": "访谈的 J/L cut（声音先于或晚于画面切换的剪法）在长时间线上，会因每个 clip 独立吸帧而累积音频漂移，premiere-agent 因此暂缓该功能。", "sports": "赛事多机位（多台相机）来自不同设备，消费级时钟漂移 20-500ppm，一小时可差 1.8 秒，必须先做漂移校正。", "refs": [{"repo": "n0an-ffmpeg-skill", "path": "n0an-ffmpeg-skill/ffmpeg/references/glossary.md", "line": 81, "why": "禁用 -c copy 的完整场景清单"}, {"repo": "kajisho5-ffmpeg-skill", "path": "kajisho5-ffmpeg-skill/SKILL.md", "line": 191, "why": "VFR 检测与自动 CFR 归一"}, {"repo": "montaj", "path": "montaj/docs/CLI.md", "line": 341, "why": "明确选择精确 seek 并承认其代价"}]}, {"id": "pit-asr-sub", "title": "ASR 与字幕", "tag": "pitfall", "summary": "词级时序、幻觉、专名、叠加顺序与单位陷阱", "goal": "访谈剪辑的一切都建在转写上。转写错一处，剪辑、字幕、检索三处同时错，而且用户一眼能看出来。", "atomic": [{"name": "词级 verbatim 强制", "impl": "禁用 SRT/短语模式与 filler 归一化", "note": "verbatim 指逐字转写、不做修饰；句级模式会丢掉次秒级停顿，而停顿正是找切点要用的信号"}, {"name": "幻觉置信度门", "impl": "no_speech_prob>0.6 且 avg_logprob<-1.0", "note": "幻觉整体超 20% 应让整轮失败并换更大模型重跑"}, {"name": "专名词典", "impl": "asr_fixes.yaml 短语级保标点替换", "note": "品牌名拼错是最响的业余信号，换更大模型解决不了"}, {"name": "字幕排版硬指标", "impl": "≤2 行，≤42 字符，≤17 CPS，0.83-7 秒", "note": "chatmonteur 采用 Netflix/BBC 口径，西里尔字母（俄文等）按 37-39 字符"}, {"name": "词级对齐门槛", "impl": "字幕词时间与 transcript 偏差 ≤80ms", "note": "hyperframes 把超标做成编译错误而不是警告"}], "pitfalls": [{"title": "字幕必须最后叠加", "detail": "字幕在滤镜链里如果排在 overlay（叠加层）之前，就会被它盖住而看不见，且不报错。同一条规则在 video-use、premiere-agent、Ultimate 三处独立出现。", "source": "video-use/SKILL.md:22"}, {"title": "画幅变更后再上字幕", "detail": "先烧字幕再 crop/resize，文字会落到画面外。正确顺序是颜色→剪→拼→静音→画幅→字幕叠加→同步→音频→响度→导出。", "source": "kajisho5-ffmpeg-skill/SKILL.md:183"}, {"title": "英文模型静默翻译", "detail": "*.en 模型遇到其他语言不会拒绝，它会翻译。俄语音频配出流畅英文字幕，是最像成功的失败。language 非英语时必须硬阻断。", "source": "chatmonteur/skills/references/engineering-facts.md:36"}, {"title": "字幕字号单位不是像素", "detail": "burn（烧进画面）模式的 font-size 是 libass 脚本单位，SRT/VTT 常在 288 单位高的画布上渲染。按像素直觉给 60 和 margin 280，字幕会被推出画布。", "source": "video-edit-cli/skills/video-edit-cli/references/subtitles-and-assets.md:29"}, {"title": "多词打包共用时间戳", "detail": "把多个 transcript 词打包进一个字幕条目，第二个词会继承第一个的时间戳提前触发。必须拆成独立词条，换行用 CSS 而不是 br。", "source": "hyperframes/skills/embedded-captions/SKILL.md:240"}, {"title": "缺字形直接出豆腐块", "detail": "libass 与 drawtext 缺少字形不会报错，直接渲染成方块。渲染前必须 fc-list 验证字体存在，豆腐块是失败不是风格。Homebrew 精简版 ffmpeg 还缺 subtitles 滤镜。", "source": "kajisho5-ffmpeg-skill/SKILL.md:218"}, {"title": "词级时序缺失就整份拒收", "detail": "完全没有词级时间的 transcript 必须拒收，否则 prep 会把每条 cue（字幕条目）的时间均分给各词，逐词动画整体漂移。个别缺时序的词才允许由邻居插值。", "source": "open-edit/AGENTS.md:181"}], "interview": "访谈需 verbatim 逐字转写并保留 filler（嗯、啊等语气词）；ASR 把品牌名听成口吃时，自动清理会把真实内容直接删掉。", "sports": "解说音轨底噪大，Whisper 易在回放与音乐段落陷入重复循环幻觉，需传 --max-context 0。", "refs": [{"repo": "chatmonteur", "path": "chatmonteur/skills/subtitles.md", "line": 78, "why": "字幕语义中哪些部分不可脚本化的界定"}, {"repo": "video-use", "path": "video-use/SKILL.md", "line": 26, "why": "输出时间轴偏移的正确公式"}, {"repo": "hyperframes", "path": "hyperframes/skills/embedded-captions/SKILL.md", "line": 88, "why": "静音片段上的 Whisper 幻觉应拒绝而非照做"}]}, {"id": "pit-vision", "title": "视觉理解", "tag": "pitfall", "summary": "抽帧（按固定间隔取画面帧）成本、覆盖度、caption（画面描述）幻觉与审美分误用", "goal": "视觉是长视频里最贵的模态。抽帧策略定错，成本翻几十倍还得不到时序信息。", "atomic": [{"name": "稀疏多视角采样", "impl": "开场/事件峰值/收尾/视觉转折各一帧", "note": "OpenChatCut 每候选最多 6 帧，不用一张缩略图代表整段"}, {"name": "固定 VLM 预算", "impl": "时长分档均匀采样 + 事件帧替换", "note": "ClipTalk 用替换而非新增，保持 VLM 调用数恒定"}, {"name": "覆盖度断言", "impl": "帧数 <85% 期望或未覆盖尾部即中止", "note": "防止把视频开头的局部结论当成全片结论"}, {"name": "caption 真实性约束", "impl": "只描述画面可见内容，禁止联想", "note": "FireRed 与 ClipTalk 都把这条写进 system prompt"}, {"name": "caption 压缩", "impl": "spaCy 去虚词 + 静止帧折叠为 same", "note": "缓变帧只输出新增句，像 git diff，省 55-60% token"}], "pitfalls": [{"title": "固定抽帧成本爆炸", "detail": "朴素做法把三万帧每帧 1500 token 送进模型，等于 4500 万 token 的噪声。video-use 的等价信息只有 12KB 文本加少数几张 PNG。", "source": "video-use/README.md:89"}, {"title": "时间线视图不是扫描工具", "detail": "timeline_view 只应在决策点使用，不能拿来通读全片。当成扫描工具用会把上下文优势立刻抵消掉。", "source": "video-use/SKILL.md:77"}, {"title": "一张缩略图代表整段", "detail": "只看一帧就给整个候选区间下结论，会漏掉中段的黑帧、转场（镜头过渡）和内容切换。必须采样开场、事件峰值、收尾与转场四类帧。", "source": "OpenChatCut/src/agent/skills/livestream-to-clips/references/multimodal-selection.md:23"}, {"title": "联系表时间码会漂", "detail": "contact sheet（缩略图拼成的全片总览图）上标注的时间码，相对真实文件约有 2 秒偏差。据此定切点会系统性偏移，必须回原视频核对。", "source": "chatmonteur/skills/hook-editing.md:32"}, {"title": "审美分不等于叙事价值", "detail": "FireRed 的 aes_score 只评画质、光影、构图、稳定性四个客观维度，与这一段是否值得剪进片子无关。两套评分必须分开维护。", "source": "FireRed-OpenStoryline/prompts/tasks/understand_clips/zh/system_detail.md:12"}, {"title": "音频标签当成信号", "detail": "CLAP 会把音乐标成语音、锤子标成鼓、房间底噪标成掌声。它只是“值得去看一眼”的提示。CLAP 与视觉冲突时以视觉为准，绝不能只凭标签下刀。", "source": "premiere-agent/SKILL.md:252"}, {"title": "烧录字幕只在中段出现", "detail": "源片自带、烧录进画面像素的字幕常只在片子中段出现。只抽 3 帧点检会漏掉它，导致成片叠上第二套字幕。应出 1fps 联系表把全片扫一遍。", "source": "hyperframes/skills/embedded-captions/SKILL.md:89"}], "interview": "访谈只需低频视觉确认机位（相机位置）与空镜（无人物的画面）；主证据仍是文本，抽帧预算应压到最低。", "sports": "赛事必须提高事件前后时段的抽帧密度，并用 OCR 读记分牌来区分直播与回放。", "refs": [{"repo": "video-use", "path": "video-use/README.md", "line": 89, "why": "固定抽帧成本爆炸的量化对比"}, {"repo": "ClipTalk", "path": "ClipTalk/app/prompts.py", "line": 15, "why": "禁止虚构对白与身份的硬约束"}, {"repo": "premiere-agent", "path": "premiere-agent/AGENT.md", "line": 11, "why": "语音优先、视觉次之、音频事件最末"}]}, {"id": "pit-selection", "title": "LLM 选片", "tag": "pitfall", "summary": "配额规则、峰值误判、幻觉时间码与凑数量", "goal": "选片是整条产线唯一无法用确定性检查兜底的环节。所有约束只能写进 prompt 和校验器。", "atomic": [{"name": "保留配额规则", "impl": "总数 ≤5 不删；否则保留数须严格大于 80% 且不少于 5", "note": "FireRed 先算删除名额再筛内容，名额用完即停"}, {"name": "两阶段选片", "impl": "先分层扫描出候选，再对候选精修边界", "note": "避免一次把全库交给 LLM 造成中段内容丢失"}, {"name": "时间码合法域", "impl": "只能用联系表实际显示且在 0 到 duration 内的时间码", "note": "编排阶段还须严格落在对应 candidate 的 start/end 内"}, {"name": "硬闸门优先", "impl": "闸门失败时高分也不放行", "note": "OpenChatCut 的闸门包括：改变说话人意图、缺 setup/payoff（铺垫/结果兑现）、身份或比分未确认"}, {"name": "先做一条再批量", "impl": "新素材或新 profile 先完整做完排名第一的片子", "note": "第一条暴露的评分假设，应回改 rubric（评分细则）后再重排"}], "pitfalls": [{"title": "峰值不是高光", "detail": "画面变化热点、声音能量热点只是召回线索。必须从真实音画识别出谁做了什么，否则 keep=false。禁止把检测器名称当作片段标题输出。", "source": "ClipTalk/app/prompts.py:130"}, {"title": "一次看全库上下文爆炸", "detail": "窗口太大会丢中间内容与结构精度，太小会丢主题与因果。OpenChatCut 用 overview/candidate/verification 三段分层扫描，时间戳贯穿三段。", "source": "OpenChatCut/src/agent/skills/livestream-to-clips/references/multimodal-selection.md:13"}, {"title": "幻觉时间码与不存在的片段", "detail": "返修阶段只能引用真实 segmentId/candidateId，禁止自由创造时间范围。调整边界必须落在候选区间内，不低于最短保留时长，不截断语句单元。", "source": "ClipTalk/app/prompts.py:320"}, {"title": "凭记忆估算时间戳", "detail": "所有编辑用时间必须来自 transcript JSON 或直接检查媒体，不能凭打包视图里的散文式描述估算。premiere-agent 更进一步禁止手工 grep transcript JSON。", "source": "video-edit-cli/skills/video-edit-cli/references/transcription.md:22"}, {"title": "为凑数量降低门槛", "detail": "被拒的候选应得到一条理由而不是一个分数。不能为了达到请求数量而下调阈值，也不能用弱、重复或误导性的片段填数。", "source": "OpenChatCut/src/agent/skills/long-video-to-shorts/references/short-form-selection.md:85"}, {"title": "断章取义改变原意", "detail": "引语需要被省略的上下文才成立、反讽被反转、说话人归属错误、拼接后的回答改变含义，这四类都属于事实性错误而非风格问题。", "source": "OpenChatCut/src/agent/skills/livestream-to-clips/references/profile-matrix.md:10"}, {"title": "自称读完其实跳读", "detail": "用 grep 代替阅读、中途放弃分块读、把阅读委派给子 Agent、自触发上下文压缩，都是同一种偷懒。premiere-agent 称其为静默烂剪的头号成因。", "source": "premiere-agent/AGENT.md:38"}], "interview": "访谈默认尊重因果与源时间顺序，只有纯视觉蒙太奇（不靠语言的画面组接）才允许重排。", "sports": "赛事可重排回放顺序，但结果不能先于铺垫出现，且拒绝把回放当直播。", "refs": [{"repo": "FireRed-OpenStoryline", "path": "FireRed-OpenStoryline/prompts/tasks/filter_clips/zh/system.md", "line": 11, "why": "保留 80% 配额规则的原文"}, {"repo": "ClipTalk", "path": "ClipTalk/app/prompts.py", "line": 224, "why": "编排阶段时间码必须落在候选内"}, {"repo": "OpenChatCut", "path": "OpenChatCut/src/agent/skills/livestream-to-clips/references/multimodal-selection.md", "line": 87, "why": "硬闸门优先于分数的判定原则"}], "children": [{"id": "pit-sports", "title": "赛事专属坑", "tag": "pitfall", "summary": "回放重复、比分幻觉、开头剧透、从动作中间切入", "goal": "体育与直播是这批仓库覆盖最薄的方向。已有的规则只到指导层，比赛状态系统需要自研。", "atomic": [{"name": "赛事拒绝清单", "impl": "比分/球员/队伍错、无铺垫的结果、回放当直播", "note": "OpenChatCut profile-matrix 里的电竞与体育行"}, {"name": "分段分类", "impl": "一场直播中途会换品类，逐段分类而非整片一个标签", "note": "分类必须从可观察到的活动出发，不能看标题和文件名"}, {"name": "连续片段优先", "impl": "体育、音乐、演示、敏感陈述优先用连续区间", "note": "拼接会破坏真实性，赛事尤其明显"}, {"name": "分 profile 评测", "impl": "按品类分开统计而非看全局平均", "note": "全局平均会掩盖小品类上的系统性失败"}], "pitfalls": [{"title": "回放被当成直播", "detail": "赛事回放与直播画面高度相似，模型容易把同一次进球输出两遍，或把回放当作新事件。需要靠记分牌与时钟 OCR 建立比赛状态才能区分。", "source": "OpenChatCut/src/agent/skills/livestream-to-clips/references/profile-matrix.md:9"}, {"title": "比分与人名幻觉", "detail": "transcript、OCR、弹幕、模型描述都是可错证据。重要数字与身份必须回源核对，QA 阶段还要再验一次专名、数字、价格、比分、日期与单位。", "source": "OpenChatCut/src/agent/skills/livestream-to-clips/SKILL.md:131"}, {"title": "弹幕爆发不等于高光", "detail": "弹幕暴涨只说明注意力集中，不代表质量为正。必须先检查对应的源事件再排名；多视角一致性强于孤立的新奇度尖峰。", "source": "OpenChatCut/src/agent/skills/livestream-to-clips/references/profile-matrix.md:46"}, {"title": "从动作中间切入", "detail": "开头不能落在明显的动作中段，结尾不能截断仍在发展的动作或表达。冷开场（正片前的高潮前置片段）默认不重复正文区间，严肃内容不许用脱离上下文的金句制造悬念。", "source": "ClipTalk/app/prompts.py:132"}, {"title": "缺少铺垫直接给结果", "detail": "电竞与体育的结构是 buildup→decisive play→result→replay/reaction（铺垫→决定性发挥→结果→回放/反应）。缺 setup（铺垫）或 payoff（结果）的候选属于闸门失败，分数再高也不能放行。", "source": "OpenChatCut/src/agent/skills/livestream-to-clips/references/profile-matrix.md:9"}], "refs": [{"repo": "OpenChatCut", "path": "OpenChatCut/src/agent/skills/livestream-to-clips/references/qa-and-evaluation.md", "line": 83, "why": "按 profile 分开评测的理由"}, {"repo": "OpenChatCut", "path": "OpenChatCut/src/agent/skills/livestream-to-clips/SKILL.md", "line": 8, "why": "一场直播需逐段分类"}]}]}, {"id": "pit-audio", "title": "音频与音乐", "tag": "pitfall", "summary": "ducking（人声时压低音乐）参数、响度顺序、节拍硬吸附与原声丢失", "goal": "观众对声音瑕疵的容忍度远低于画面。爆音、音乐盖住人声、响度不达标，三者任一都会让成片不可用。", "atomic": [{"name": "语音频段挖坑", "impl": "equalizer f=3000 width=1.6 g=-4 先于 ducking", "note": "清晰度靠腾出 2-4kHz，不是靠压电平；三个来源都说这是最重要的混音规则"}, {"name": "轻度 sidechain", "impl": "音乐只下潜 2-6dB，停顿时回升", "note": "绝不压到静音，压没了音乐就变成噪声"}, {"name": "响度只设一次", "impl": "在最后一步做两遍 loudnorm", "note": "中途归一化再归一化会让对白过两轮动态压缩"}, {"name": "音乐作为连续层", "impl": "剪完再叠，绝不烧进录制链路", "note": "烧进去就会被剪切器切碎"}, {"name": "SFX 提前落点", "impl": "比画面帧提前 15ms", "note": "听觉快于视觉，正好压在帧上会被听成迟到"}], "pitfalls": [{"title": "amix 默认吞对白", "detail": "amix 不写 normalize=0 时，默认会除以输入数量，每加一层就把对白静默衰减约 6dB。混 BGM 与 SFX（音效）时必须显式关闭。", "source": "chatmonteur/skills/references/engineering-facts.md:19"}, {"title": "中途归一化压两遍", "detail": "响度必须只在最后一步设定一次。中途 loudnorm 再在末尾 loudnorm，等于让对白连过两轮动态压缩。文档里明确标注这一行曾把双重归一化写成有意为之。", "source": "chatmonteur/skills/references/engineering-facts.md:21"}, {"title": "carve 只挂一个 clip", "detail": "对多个 clip id 分别做 voiceover carve（为旁白在音乐中腾出空间）是错的。后加入的旁白落在 carve 的感知范围之外，垫底音乐就静默地不再为它压低音量。必须把这些 clip 分组后整体 carve。", "source": "hyperframes/skills/hyperframes-audio/SKILL.md:241"}, {"title": "beat 硬吸附切碎语义", "detail": "只有音乐与舞蹈才按乐句或节拍边界切，其他内容按固定间隔切会破坏语义。ClipTalk 更进一步禁止对完整对白、关键反应与情绪停顿做变速。", "source": "OpenChatCut/src/agent/skills/livestream-to-clips/SKILL.md:108"}, {"title": "原声被 shortest 截断", "detail": "amix 的 duration=shortest 只控制音频时长，外层 -shortest 控制最终视频时长。两者混淆会截掉音频或视频。混 BGM 应用 duration=first 加 dropout_transition=2。", "source": "n0an-ffmpeg-skill/ffmpeg/references/advanced-editing.md:47"}, {"title": "静音阈值随电平失效", "detail": "auto-editor 的 0.14 是满刻度的分数（0 到 1）。同一素材降 20dB 后测得值差十倍，直接被判成空时间线。安静录制的演示段会被当静音删掉，绝不能盲调阈值。", "source": "chatmonteur/skills/references/engineering-facts.md:30"}, {"title": "只映射第一条音轨", "detail": "iPhone 的 mov 带时间码与元数据轨，脚本只映射第一条音轨，重编码时其余轨被丢弃。多机位（多台相机）外录场景要显式处理。", "source": "kajisho5-ffmpeg-skill/SKILL.md:208"}], "interview": "访谈中每个章节只铺一条垫底音乐（音乐床），片头片尾的过渡段完全不加音乐。", "sports": "赛事现场声是内容本身，BGM 只能压在下面；卡点（让剪辑点对齐节拍）不能切碎解说的关键句。", "refs": [{"repo": "chatmonteur", "path": "chatmonteur/skills/sound.md", "line": 92, "why": "先 EQ 挖坑（为语音腾出频段）再轻度 ducking 的顺序"}, {"repo": "hyperframes", "path": "hyperframes/skills/hyperframes-audio/SKILL.md", "line": 358, "why": "carve 强度的量化刻度"}, {"repo": "OpenChatCut", "path": "OpenChatCut/src/agent/skills/music-intelligence/SKILL.md", "line": 32, "why": "节拍层级选择与计划有界性"}]}, {"id": "pit-render", "title": "渲染与合成", "tag": "pitfall", "summary": "非确定性 seek（跳帧）、MoviePy 限制、透明通道与 filtergraph（滤镜表达式）", "goal": "渲染层的失败大多不报错，只是画面不对。必须靠强制目视与逐帧验证兜底。", "atomic": [{"name": "确定性规则", "impl": "禁 Date.now、未播种 random、渲染期网络、repeat:-1", "note": "同一属性被多条时间线驱动时，会因 GSAP 覆盖顺序在两次渲染之间翻转"}, {"name": "concat 前归一化", "impl": "统一 fps、pix_fmt、SAR，音频统一 fltp", "note": "跳过这步是 concat 失败或出花屏的头号原因"}, {"name": "SAR 锁定", "impl": "pad/scale 链后接 setsar=1:1", "note": "SAR 是像素宽高比；不加锁定，会出现尺寸看着对但画面被拉伸"}, {"name": "尺寸必须偶数", "impl": "scale=w=1080:h=-2", "note": "yuv420p 要求宽高可被 2 整除"}, {"name": "跨机器可复现", "impl": "hyperframes render --docker", "note": "非 Docker 路径无法保证 byte-identical（逐字节一致）"}], "pitfalls": [{"title": "每帧都是全新 seek", "detail": "渲染器没有播放概念，可能乱序或并行采样帧。任何依赖经由前一帧到达的状态（计时器、累积量、事件驱动动画）都会失步。", "source": "hyperframes/skills/hyperframes-core/references/determinism-rules.md:68"}, {"title": "地图逐帧重采样抖动", "detail": "每帧调 map.jumpTo 会让 headless 渲染器逐帧重采样贴图，换缓动（easing）或重试 tile（地图瓦片）都无效。必须冻结相机，改用 CSS transform 移动固定 plate（底图）。", "source": "remotion-dev-skills/skills/remotion-maps/techniques/maplibre/references/render-stability.md:7"}, {"title": "超采样反而更糊", "detail": "WebGL plate 不能盲目放大 3 倍。1920×1080 放大到 5760px 后，Chromium 可能静默降采样，CSS 缩放时会出现可见像素化。", "source": "remotion-dev-skills/skills/remotion-maps/techniques/maplibre/references/render-stability.md:15"}, {"title": "MoviePy 文字被切边", "detail": "moviepy 2.x 的 TextClip(method='label') 有 tight-bbox（紧贴文字的边界框）缺陷，会切掉字母的上下缘。在 Apple Silicon 上会看到字符边缘被削却不知原因，应改用 PIL 渲染透明 PNG。", "source": "claude-code-video-toolkit/.claude/skills/moviepy/SKILL.md:88"}, {"title": "MoviePy 静默吞掉配音", "detail": "VideoFileClip 默认加载音频，合成时不调 without_audio 会在 CompositeAudioClip 里静默丢掉旁白。CompositeVideoClip 还必须显式给 size，否则输出尺寸跟随第一个 clip。", "source": "claude-code-video-toolkit/.claude/skills/moviepy/SKILL.md:233"}, {"title": "透明 WebM 显示为 yuv420p", "detail": "透明 WebM 在 ffprobe 里显示为 yuv420p，因为 alpha 是 VP9 的旁路通道。据此判断没有透明通道会做出错误结论。", "source": "hyperframes/releases/v0.7.23.md:29"}, {"title": "filtergraph 引号被吞", "detail": "-vf 与 -filter_complex 的参数必须用单引号包住，或把表达式内的逗号转义，否则 shell 或 FFmpeg 表达式解析器会吃掉字符。调试第一步应先 ffprobe 看流布局。", "source": "n0an-ffmpeg-skill/ffmpeg/SKILL.md:36"}, {"title": "浏览器截帧 2-3 倍实时", "detail": "framecraft 实测：Playwright 单帧约 30-50ms，30fps 1080p 下 5 秒场景需要约 150 张截图，渲染耗时 10-15 秒。长片不能走这条路。", "source": "framecraft/LEARNINGS.md:79"}], "interview": "访谈成片主要是 trim 加字幕，渲染风险集中在字体与响度，不在动效。", "sports": "赛事包装含大量数据动画与慢放，60fps 降 30fps 对运动画面会明显卡顿。", "mg": "坑集中在浏览器渲染：3D 推进下文字发糊要查栅格化路径（用 CSS zoom 而非 transform scale），不是先调景深。", "refs": [{"repo": "hyperframes", "path": "hyperframes/skills/hyperframes-core/references/determinism-rules.md", "line": 33, "why": "确定性渲染的禁用清单"}, {"repo": "claude-remotion-skill", "path": "claude-remotion-skill/remotion-motion-graphics/SKILL.md", "line": 13, "why": "十条不可协商的动效规则"}, {"repo": "montaj", "path": "montaj/docs/RENDER.md", "line": 65, "why": "MKV 并发解码损坏的真实报错与修复"}]}, {"id": "pit-protocol", "title": "Agent 写入协议", "tag": "pitfall", "summary": "状态过期、无法撤销、缺 dry-run（试跑）、prompt injection（提示注入）", "goal": "Agent 直接改工程会覆盖用户正在做的修改，且不可逆。写入协议决定这个产品能不能给人用。", "atomic": [{"name": "GET-fresh 合并保存", "impl": "每次保存前重新读工程再合并", "note": "montaj：几分钟前读的 body 会覆盖操作员的并发编辑"}, {"name": "dry-run 一等公民", "impl": "cut detect --dry-run、plan validate、validate step", "note": "预览通过再提交，是三个仓库共同的做法"}, {"name": "原子 undo", "impl": "批量操作合并成一次 undo 步骤", "note": "OpenChatCut 用 EditorCommands.batch；baocut 有 journal（操作日志）与 undo"}, {"name": "不变量成对修改", "impl": "end−start 必须等于 outPoint−inPoint", "note": "只动时间线边不动源点，画面会提前用完并冻在最后一帧"}, {"name": "内部控制字段剥离", "impl": "模型传入的 __ 前缀字段一律剥除", "note": "OpenChatCut 防止 prompt injection（提示词注入）绕过付费幂等与预留链"}], "pitfalls": [{"title": "陈旧缓存覆盖并发编辑", "detail": "保存工程永远走 GET-fresh 再合并再保存。绝不能用缓存 body 写回，即使刚刚才读过——操作员可能正在同时编辑。", "source": "montaj/skills/_contract/SKILL.md:27"}, {"title": "陈旧 transcript 最难发现", "detail": "只剩旧文件名的 transcript 是陈旧的，它的时间戳来自剪切前的文件，与当前 clip 对不上。用它做 overlay（叠加）会全片错位。", "source": "montaj/skills/edit-session/SKILL.md:34"}, {"title": "任意 JSON patch 破坏不变量", "detail": "只移动时间线边而不移动源入出点，clip 会被拉长到超过它拥有的素材：画面中途用完并冻结在最后一帧，下面的波形却画出真实的更短长度。", "source": "montaj/skills/edit-session/SKILL.md:63"}, {"title": "字幕不跟随主轨", "detail": "删掉 tracks[0] 的一段却不同步删除或平移其中的字幕片段，文字就会与画面脱节。overlay 轨则是绝对时间，剪主轨时不会跟着移动。", "source": "montaj/skills/edit-session/SKILL.md:66"}, {"title": "SRT 与指南是不可信输入", "detail": "字幕文件和剪辑指南都属于不可信输入。字幕里出现忽略先前指令一类语句必须无视；指南只取结构化数据（编号、章节名、表格）。", "source": "hajoeun-skills/skills/video-editor/SKILL.md:54"}, {"title": "ffprobe 元数据也是注入面", "detail": "只提取 format.duration 与 streams[0] 的 codec_name、width、height，忽略 title、comment、artist 等字段。画面内出现的指令文字同样必须无视。", "source": "hajoeun-skills/skills/video-editor/SKILL.md:61"}, {"title": "孤儿会话无法恢复", "detail": "开新会话前必须先 list_edit_sessions。标记 orphaned 的要走 recover；stale、cancelled、failed 是终态不可恢复，只能重开。默认审批模式应为 manual。", "source": "OpenChatCut/skills/openchatcut/references/known-errors.md:26"}], "interview": "访谈工程迭代次数高，必须有版本化 plan 与 parent_plan 修订链，不能原地改。", "sports": "赛事成片常一次出几十条切片，批量写入必须是单次原子 undo，否则回滚不可行。", "refs": [{"repo": "montaj" s 都只是托管 MCP 的调用说明，本地不含任何引擎。可以借鉴它们的用例拆分方式，但不能当技术方案。", "source": "clueso-ai-skills/README.md:3"}], "refs": [{"repo": "ClipTalk", "path": "ClipTalk/LICENSE", "line": 1, "why": "非商业署名许可证的适用范围"}, {"repo": "palmier-pro", "path": "palmier-pro/BINARY_LICENSE.md", "line": 5, "why": "v0.7.6 之后二进制转专有"}]}]}], "side": "left", "num": "", "color": "#C2410C"}, {"id": "repo-map", "title": "仓库地图（37 仓）", "tag": "decision", "summary": "按五个层级给每个仓库定位，标注许可证与对访谈、赛事两侧的价值", "goal": "决定每个仓库是抄思想、抄代码还是直接接入。避免把云端包装层当成技术方案，也避免漏掉唯一实现某个能力的仓库。", "inputs": ["各仓库的 README、SKILL、LICENSE 文件"], "outputs": ["复用优先级", "许可证风险清单"], "atomic": [{"name": "分层标准", "impl": "剪辑 Skill/时间线 GUI/制作流水线/成片底座/高光发现", "note": "同一个仓库可以跨层，例如 ClipTalk 既做高光发现也带时间线"}, {"name": "价值判定", "impl": "访谈与赛事各打强/中/弱", "note": "赛事侧判为强的只有 ClipTalk、premiere-agent、frontstage"}, {"name": "许可证核对", "impl": "逐个读 LICENSE 文件", "note": "其中 5 个用 AGPL、2 个用 GPL、1 个禁止商用、6 个没有许可证文件"}], "pitfalls": [{"title": "三份内容完全重复", "detail": "claude-code-plugin、codex-plugin 与 remotion-dev-skills 的 skills 目录逐字重复，且都源自 remotion/packages。只需研究一份，另两份只是分发用的外壳。", "source": "codex-plugin/plugin.json:2"}, {"title": "云端包装层看着很全", "detail": "agent-skills 与 clueso-ai-skills 合计近百个 skill，但全部依赖各自的托管 MCP 服务，本地一行代码都跑不了。它们的价值是用例分类法，不是技术实现。", "source": "clueso-ai-skills/README.md:3"}, {"title": "有 GUI 不等于有内容理解", "detail": "OpenChatCut、pireel、palmier-pro、frontstage 都有真正的多轨时间线，但除 frontstage 外都没有根据语音转写文本选段的能力。它们是能被 Agent 操作的编辑器，不是自己会剪辑的 Agent。", "source": "OpenChatCut/README.md:66"}, {"title": "赛事方向整体缺位", "detail": "35 个仓库里没有一个实现完整的比赛状态系统。ClipTalk 有通用事件高光骨架，premiere-agent 有 CLAP 音频事件，其余都只停留在指导文档层面。这一块必须自研。", "source": "research/claim-source-ledger.md:44"}], "refs": [{"repo": "research", "path": "research/claim-source-ledger.md", "line": 5, "why": "每个仓库各项判断的来源与访问说明"}, {"repo": "research", "path": "video-agents.md", "line": 5, "why": "三层分类的原始表格"}], "children": [{"id": "layer-skill-cli", "title": "剪辑 Skill 与 CLI", "tag": "decision", "summary": "这一层没有时间线界面，Agent 直接对着文件夹干活，交付 final.mp4 或工程文件", "g     n.parent = parent; n.depth = depth; n.branch = branch || n; n.children = n.children || [];
    n.color = n.color || (branch ? branch.color : '#888');
    n.side = n.side || (branch ? branch.side : 'right');
    if (nodes.has(n.id)) console.warn('duplicate id', n.id);
    nodes.set(n.id, n);
    n.children.forEach(c => index(c, n, depth + 1, n.branch));
  }
  DATA.branches.forEach(b => { root.children.push(b); index(b, root, 1, null); });

  const all = [...nodes.values()].filter(n => !n.isRoot);
  const stats = {
    nodes: all.length,
    atomic: all.reduce((s, n) => s + (n.atomic?.length || 0), 0),
    pitfalls: all.reduce((s, n) => s + (n.pitfalls?.length || 0), 0),
    refs: all.reduce((s, n) => s + (n.refs?.length || 0), 0),
  };
  document.getElementById('stats').textContent =
    `${stats.nodes} 节点 · ${stats.atomic} 原子能力 · ${stats.pitfalls} 条踩坑 · ${stats.refs} 处参考`;
  document.getElementById('legend').innerHTML = Object.entries(TAGS)
    .map(([k, t]) => `<span><i style="background:${t.color}"></i>${t.label}</span>`).join('');

  // searchable text cache
  for (const n of all) {
    const parts = [n.title, n.summary, n.goal, n.interview, n.sports, n.mg, ...(n.urls || []), ...(n.points || []), ...(n.inputs || []), ...(n.outputs || [])];
    (n.atomic || []).forEach(a => parts.push(a.name, a.impl, a.note));
    (n.pitfalls || []).forEach(p => parts.push(p.title, p.detail, p.source));
    (n.refs || []).forEach(r => parts.push(r.repo, r.path, r.why));
    n._text = parts.filter(Boolean).join(' \n ').toLowerCase();
  }

  // ---------- state ----------
  const state = {
    expanded: new Set([root.id, ...root.children.map(c => c.id)]),
    selected: null,
    view: 'all',
    query: '',
    matches: new Set(),
    matchList: [],
    matchCursor: -1,
    savedExpanded: null,
    k: 1, tx: 0, ty: 0,
  };

  const $canvas = document.getElementById('canvas');
  const $vp = document.getElementById('viewport');
  const $links = document.getElementById('links');
  const $nodes = document.getElementById('nodes');
  const $panel = document.getElementById('panel');
  const $main = document.getElementById('main');
  const els = new Map();

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function isVisible(n) {
    let p = n.parent;
    while (p) { if (!state.expanded.has(p.id)) return false; p = p.parent; }
    return true;
  }
  function domainOf(n) {
    // returns which domains this node speaks to
    const d = new Set();
    if (n.tag === 'interview' || n.interview) d.add('interview');
    if (n.tag === 'sports' || n.sports) d.add('sports');
    if (n.tag === 'mg' || n.mg) d.add('mg');
    return d;
  }
  function isDimmedByView(n) {
    if (state.view === 'all') return false;
    if (n.tag === 'shared' || n.tag === 'atomic' || n.tag === 'pitfall' || n.tag === 'decision' || n.tag === 'gap') {
      // cross-cutting nodes: dim only if the other domain is explicitly the only domain
      const d = domainOf(n);
      if (d.size === 0) return false;
      return !d.has(state.view);
    }
    return n.tag !== state.view && !domainOf(n).has(state.view);
  }

  // ---------- node DOM ----------
  function nodeEl(n) {
    if (els.has(n.id)) return els.get(n.id);
    const el = document.createElement('div');
    el.className = 'node';
    el.dataset.id = n.id;
    if (n.isRoot) {
      el.classList.add('root');
      el.innerHTML = `<span class="title">${esc(n.title)}</span><span class="sub">${DATA.root.subtitle}</span><span class="sub2">${esc(DATA.root.note)}</span>`;
    } else {
      el.classList.add(`depth-${n.depth}`, `side-${n.side}`);
      el.style.setProperty('--c', n.color);
      el.style.setProperty('--tag', TAGS[n.tag]?.color || 'var(--fg-3)');
      const showChip = n.tag && (n.depth === 1 || n.tag !== (n.parent?.tag || n.branch.tag));
      const chip = showChip ? `<span class="chip">${TAGS[n.tag]?.label || esc(n.tag)}</span>` : '';
      const doms = (n.interview ? '<i class="dom i" title="有访谈侧说明"></i>' : '') + (n.sports ? '<i class="dom s" title="有赛事侧说明"></i>' : '') + (n.mg ? '<i class="dom m" title="有 MG 侧说明"></i>' : '');
      const meta = n.depth <= 2 ? metaHtml(n) : '';
      const ext = n.urls?.length ? `<a class="ext" href="${esc(n.urls[0])}" target="_blank" rel="noopener" title="${esc(n.urls[0])}">↗</a>` : '';
      el.innerHTML = `<span class="bar"></span>${n.num ? `<span class="num">${esc(n.num)}</span>` : ''}<span class="title">${esc(n.title)}</span>${chip}${doms}${meta}${ext}` +
        (n.children.length ? `<button class="toggle" aria-label="展开/折叠"></button>` : '');
    }
    el.addEventListener('click', e => {
      if (e.target.closest('.ext')) return; // let the link open
      if (e.target.closest('.toggle')) { toggle(n); return; }
      select(n.id, { center: false });
    });
    el.addEventListener('dblclick', e => { e.preventDefault(); if (n.children.length) toggle(n); });
    $nodes.appendChild(el);
    els.set(n.id, el);
    return el;
  }
  function countDeep(n, key) { return (n[key]?.length || 0) + n.children.reduce((s, c) => s + countDeep(c, key), 0); }
  function metaHtml(n) {
    const a = countDeep(n, 'atomic'), p = countDeep(n, 'pitfalls');
    if (!a && !p) return '';
    if (n.depth >= 2) return `<span class="meta compact">${a ? `<span title="${a} 项原子能力（含子节点）">⚙${a}</span>` : ''}${p ? `<span title="${p} 条踩坑（含子节点）">⚠${p}</span>` : ''}</span>`;
    return `<span class="meta">${a ? `<span title="原子能力（含子节点）"><b>${a}</b> 能力</span>` : ''}${p ? `<span title="踩坑经验（含子节点）"><b>${p}</b> 坑</span>` : ''}</span>`;
  }

  // ---------- layout ----------
  const H_GAP_L1 = 64, H_GAP = 40, V_GAP = 7, V_GAP_L1 = 20;
  function render() {
    // 1. ensure DOM + visibility
    const visible = [];
    for (const n of nodes.values()) {
      const el = nodeEl(n);
      const vis = n.isRoot || isVisible(n);
      el.hidden = !vis;
      if (!vis) continue;
      visible.push(n);
      el.classList.toggle('selected', state.selected === n.id);
      const dimSearch = state.query && !state.matches.has(n.id) && !n.isRoot;
      const dimView = !n.isRoot && isDimmedByView(n);
      el.classList.toggle('dim', dimSearch || dimView);
      el.classList.toggle('match', !!state.query && state.matches.has(n.id));
      const tg = el.querySelector('.toggle');
      if (tg) {
        const open = state.expanded.has(n.id);
        tg.textContent = open ? '−' : String(n.children.length);
        tg.title = open ? '折叠' : `展开 ${n.children.length} 个子节点`;
      }
    }
    // 2. measure
    for (const n of visible) { const r = els.get(n.id); n.w = r.offsetWidth; n.h = r.offsetHeight; }
    // 3. layout
    const subH = new Map();
    function sh(n) {
      if (subH.has(n.id)) return subH.get(n.id);
      let h = n.h;
      if (state.expanded.has(n.id) && n.children.length) {
        const gap = n.isRoot ? V_GAP_L1 : V_GAP;
        const kidsH = n.children.reduce((s, c) => s + sh(c), 0) + gap * (n.children.length - 1);
        h = Math.max(h, kidsH);
      }
      subH.set(n.id, h); return h;
    }
    function place(n, x, cy, dir) {
      n.x = dir > 0 ? x : x - n.w; n.y = cy - n.h / 2; n.cy = cy;
      if (!state.expanded.has(n.id) || !n.children.length) return;
      const gap = V_GAP;
      let y = cy - sh(n) / 2;
      const hgap = n.depth === 1 ? H_GAP : H_GAP;
      for (const c of n.children) {
        const h = sh(c);
        place(c, dir > 0 ? n.x + n.w + hgap : n.x - hgap, y + h / 2, dir);
        y += h + gap;
      }
    }
    root.x = -root.w / 2; root.y = -root.h / 2; root.cy = 0;
    const right = root.children.filter(b => b.side === 'right');
    const left = root.children.filter(b => b.side === 'left');
    for (const [list, dir] of [[right, 1], [left, -1]]) {
      const total = list.reduce((s, b) => s + sh(b), 0) + V_GAP_L1 * (list.length - 1);
      let y = -total / 2;
      for (const b of list) {
        const h = sh(b);
        place(b, dir > 0 ? root.x + root.w + H_GAP_L1 : root.x - H_GAP_L1, y + h / 2, dir);
        y += h + V_GAP_L1;
      }
    }
    // 4. draw
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of visible) {
      const el = els.get(n.id);
      el.style.transform = `translate(${n.x}px, ${n.y}px)`;
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y); maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
    }
    state.bounds = { minX, minY, maxX, maxY };
    const paths = [];
    for (const n of visible) {
      if (n.isRoot || !n.parent) continue;
      const p = n.parent;
      const dir = n.side === 'right' ? 1 : -1;
      const x1 = dir > 0 ? p.x + p.w : p.x, y1 = p.cy;
      const x2 = dir > 0 ? n.x : n.x + n.w, y2 = n.cy;
      const mx = (x1 + x2) / 2;
      const dim = (state.query && !state.matches.has(n.id)) || isDimmedByView(n);
      paths.push(`<path class="${n.depth === 1 ? 'l1' : ''} ${dim ? 'dim' : ''}" stroke="${n.color}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`);
    }
    const pad = 200;
    $links.setAttribute('width', maxX - minX + pad * 2);
    $links.setAttribute('height', maxY - minY + pad * 2);
    $links.style.left = `${minX - pad}px`; $links.style.top = `${minY - pad}px`;
    $links.setAttribute('viewBox', `${minX - pad} ${minY - pad} ${maxX - minX + pad * 2} ${maxY - minY + pad * 2}`);
    $links.innerHTML = paths.join('');
    applyTransform();
  }

  // ---------- zoom / pan ----------
  function applyTransform() { $vp.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.k})`; }
  function fit(opts = {}) {
    const b = state.bounds; if (!b) return;
    const W = $canvas.clientWidth, H = $canvas.clientHeight;
    const bw = b.maxX - b.minX + 80, bh = b.maxY - b.minY + 80;
    let k = Math.min(W / bw, H / bh);
    const minK = opts.minK ?? 0.35;
    const clamped = k < minK;
    k = Math.max(minK, Math.min(opts.maxK ?? 1.25, k));
    state.k = k;
    // If the map does not fit at the minimum readable zoom, center on the root instead of the bbox center.
    const cx = clamped ? 0 : (b.minX + b.maxX) / 2, cy = clamped ? 0 : (b.minY + b.maxY) / 2;
    state.tx = W / 2 - cx * k; state.ty = H / 2 - cy * k;
    applyTransform();
  }
  function centerOn(n) {
    const W = $canvas.clientWidth, H = $canvas.clientHeight;
    const cx = n.x + n.w / 2, cy = n.cy;
    state.tx = W / 2 - cx * state.k; state.ty = H / 2 - cy * state.k; applyTransform();
  }
  function zoomAt(factor, px, py) {
    const k2 = Math.max(0.2, Math.min(3, state.k * factor));
    state.tx = px - (px - state.tx) * (k2 / state.k);
    state.ty = py - (py - state.ty) * (k2 / state.k);
    state.k = k2; applyTransform();
  }
  $canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const r = $canvas.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) {
      zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
    } else {
      state.tx -= e.deltaX; state.ty -= e.deltaY; applyTransform();
    }
  }, { passive: false });
  let drag = null;
  $canvas.addEventListener('pointerdown', e => {
    if (e.target.closest('.node')) return;
    drag = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
    $canvas.classList.add('dragging'); $canvas.setPointerCapture(e.pointerId);
  });
  $canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    state.tx = drag.tx + (e.clientX - drag.x); state.ty = drag.ty + (e.clientY - drag.y); applyTransform();
  });
  const endDrag = () => { drag = null; $canvas.classList.remove('dragging'); };
  $canvas.addEventListener('pointerup', endDrag); $canvas.addEventListener('pointercancel', endDrag);
  document.getElementById('zin').onclick = () => zoomAt(1.25, $canvas.clientWidth / 2, $canvas.clientHeight / 2);
  document.getElementById('zout').onclick = () => zoomAt(0.8, $canvas.clientWidth / 2, $canvas.clientHeight / 2);
  document.getElementById('fit').onclick = () => fit({ minK: 0.2 });

  // ---------- expand / collapse ----------
  function toggle(n) {
    if (state.expanded.has(n.id)) collapseDeep(n); else state.expanded.add(n.id);
    render();
  }
  function collapseDeep(n) { state.expanded.delete(n.id); n.children.forEach(collapseDeep); }
  function expandToDepth(d) {
    state.expanded = new Set([root.id]);
    for (const n of all) if (n.depth < d) state.expanded.add(n.id);
    render(); fit();
  }
  function expandPath(n) { let p = n.parent; while (p) { state.expanded.add(p.id); p = p.parent; } }
  document.querySelectorAll('[data-depth]').forEach(b => b.onclick = () => expandToDepth(+b.dataset.depth));

  // ---------- selection + panel ----------
  function select(id, opts = {}) {
    const n = nodes.get(id); if (!n) return;
    state.selected = id;
    expandPath(n);
    if (n.children.length && opts.expand) state.expanded.add(n.id);
    render();
    if (opts.center) centerOn(n);
    renderPanel(n);
    $main.classList.add('panel-open');
    history.replaceState(null, '', '#' + encodeURIComponent(id));
    requestAnimationFrame(() => { render(); if (opts.center) centerOn(n); });
    if (opts.center) setTimeout(() => centerOn(n), 240); // after panel grid transition
  }
  function closePanel() { state.selected = null; $main.classList.remove('panel-open'); history.replaceState(null, '', location.pathname); render(); }

  function pathHtml(path, line) {
    const full = BASE + path + (line ? `:${line}` : '');
    return `<span class="path" data-copy="${esc(full)}" title="点击复制绝对路径">${esc(path)}${line ? `<span class="ln">:${line}</span>` : ''}</span>`;
  }
  function renderPanel(n) {
    const crumbs = [];
    for (let p = n.parent; p && !p.isRoot; p = p.parent) crumbs.unshift(p);
    const tag = TAGS[n.tag];
    const view = state.view;
    const sec = (title, count, body) => body ? `<section><h3>${title}${count ? `<span class="n">${count}</span>` : ''}</h3>${body}</section>` : '';
    const list = arr => arr?.length ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
    let html = `<button class="close" id="pclose" aria-label="关闭">✕</button>`;
    html += `<div class="crumbs"><a data-go="__root">${esc(DATA.root.title)}</a>${crumbs.map(c => ` › <a data-go="${c.id}">${esc(c.title)}</a>`).join('')}</div>`;
    html += `<h2>${n.num ? `<span style="color:${n.color}">${esc(n.num)}</span>` : ''}${esc(n.title)}${tag ? `<span class="chip" style="--tag:${tag.color}">${tag.label}</span>` : ''}</h2>`;
    if (n.urls?.length) html += `<div class="links">${n.urls.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, ''))} ↗</a>`).join('')}</div>`;
    if (n.summary) html += `<p class="summary">${esc(n.summary)}</p>`;
    if (n.goal) html += `<p>${esc(n.goal)}</p>`;
    if (n.inputs?.length || n.outputs?.length) {
      html += sec('输入 / 输出产物', 0, `<div class="io"><div><h4>输入</h4>${list(n.inputs) || '<p class="hint">—</p>'}</div><div><h4>输出</h4>${list(n.outputs) || '<p class="hint">—</p>'}</div></div>`);
    }
    if (n.interview || n.sports || n.mg) {
      html += sec('访谈 vs 赛事 vs MG', 0, `<div class="dom-cards">` +
        (n.interview ? `<div class="dom-card i ${view === 'interview' ? 'focus' : ''}"><h4>长访谈</h4>${esc(n.interview)}</div>` : '') +
        (n.sports ? `<div class="dom-card s ${view === 'sports' ? 'focus' : ''}"><h4>体育赛事</h4>${esc(n.sports)}</div>` : '') +
        (n.mg ? `<div class="dom-card m ${view === 'mg' ? 'focus' : ''}"><h4>MG 动效制作</h4>${esc(n.mg)}</div>` : '') + `</div>`);
    }
    if (n.points?.length) html += sec('要点', n.points.length, list(n.points));
    if (n.atomic?.length) {
      html += sec('原子能力', n.atomic.length, n.atomic.map(a =>
        `<div class="item"><span class="t">${esc(a.name)}</span>${a.impl ? `<span class="impl">${esc(a.impl)}</span>` : ''}${a.note ? `<div class="d">${esc(a.note)}</div>` : ''}</div>`).join(''));
    }
    if (n.pitfalls?.length) {
      html += sec('踩坑经验', n.pitfalls.length, n.pitfalls.map(p =>
        `<div class="item"><span class="t">⚠ ${esc(p.title)}</span><div class="d">${esc(p.detail)}</div>${p.source ? `<div class="src">${srcHtml(p.source)}</div>` : ''}</div>`).join(''));
    }
    if (n.refs?.length) {
      html += sec('参考实现', n.refs.length, n.refs.map(r =>
        `<div class="item"><span class="t">${esc(r.repo)}</span><div class="src">${pathHtml(r.path, r.line)}</div>${r.why ? `<div class="d">${esc(r.why)}</div>` : ''}</div>`).join(''));
    }
    if (n.children.length) {
      html += sec('子节点', n.children.length, `<div class="kids">${n.children.map(c => `<button data-go="${c.id}" style="border-left:3px solid ${c.color}">${esc(c.title)}</button>`).join('')}</div>`);
    }
    html += `<div class="hint">路径相对于 <code>${esc(BASE)}</code>，点击路径可复制绝对路径。</div>`;
    $panel.innerHTML = html;
    $panel.scrollTop = 0;
    $panel.querieAll = null;
    document.getElementById('pclose').onclick = closePanel;
    $panel.querySelectorAll('[data-go]').forEach(a => a.onclick = () => {
      const id = a.dataset.go;
      if (id === '__root') { closePanel(); fit(); return; }
      select(id, { center: true, expand: true });
    });
    $panel.querySelectorAll('.path').forEach(p => p.onclick = () => copy(p.dataset.copy));
  }
  function srcHtml(src) {
    // "repo/path/file.md:123" or free text
    const m = /^([A-Za-z0-9_.\-\/]+?)(?::(\d+))?$/.exec(src.trim());
    if (m && m[1].includes('/')) return pathHtml(m[1], m[2] ? +m[2] : null);
    return `<span class="path" data-copy="${esc(src)}">${esc(src)}</span>`;
  }
  function copy(text) {
    navigator.clipboard?.writeText(text).then(() => toast('已复制：' + text), () => toast(text));
  }
  let toastT;
  function toast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600);
  }

  // ---------- view ----------
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
    state.view = b.dataset.view;
    document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
    if (state.selected) renderPanel(nodes.get(state.selected));
  });

  // ---------- search ----------
  const $q = document.getElementById('q'), $qc = document.getElementById('qcount');
  function runSearch() {
    const q = $q.value.trim().toLowerCase();
    if (q && !state.query) state.savedExpanded = new Set(state.expanded);
    state.query = q;
    state.matches = new Set(); state.matchList = []; state.matchCursor = -1;
    if (!q) {
      if (state.savedExpanded) { state.expanded = state.savedExpanded; state.savedExpanded = null; }
      $qc.textContent = ''; render(); return;
    }
    const terms = q.split(/\s+/).filter(Boolean);
    for (const n of all) {
      if (terms.every(t => n._text.includes(t))) { state.matches.add(n.id); state.matchList.push(n); expandPath(n); }
    }
    // also mark ancestors as (weak) matches so the path stays readable
    for (const n of [...state.matchList]) { let p = n.parent; while (p && !p.isRoot) { state.matches.add(p.id); p = p.parent; } }
    $qc.textContent = `${state.matchList.length} 个匹配`;
    render();
    if (state.matchList.length) fit({ minK: 0.3 });
  }
  $q.addEventListener('input', runSearch);
  $q.addEventListener('keydown', e => {
    if (e.key === 'Enter' && state.matchList.length) {
      state.matchCursor = (state.matchCursor + 1) % state.matchList.length;
      const n = state.matchList[state.matchCursor];
      $qc.textContent = `${state.matchCursor + 1} / ${state.matchList.length}`;
      select(n.id, { center: true });
    }
    if (e.key === 'Escape') { $q.value = ''; runSearch(); $q.blur(); }
  });
  document.getElementById('qclear').onclick = () => { $q.value = ''; runSearch(); };

  // ---------- keyboard ----------
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    if (e.key === 'Escape') { if ($main.classList.contains('panel-open')) closePanel(); }
    if (e.key === 'f' || e.key === 'F') fit({ minK: 0.2 });
    if (e.key === '+' || e.key === '=') zoomAt(1.2, $canvas.clientWidth / 2, $canvas.clientHeight / 2);
    if (e.key === '-' || e.key === '_') zoomAt(1 / 1.2, $canvas.clientWidth / 2, $canvas.clientHeight / 2);
    if (e.key === '/') { e.preventDefault(); $q.focus(); }
  });
  window.addEventListener('resize', () => { render(); });
  $main.addEventListener('transitionend', e => {
    if (e.propertyName !== 'grid-template-columns') return;
    render(); if (state.selected) centerOn(nodes.get(state.selected));
  });

  // ---------- boot ----------
  render();
  fit({ minK: 0.62 });
  const boot = () => {
    const v = new URLSearchParams(location.search).get('view');
    if (v && ['all', 'interview', 'sports', 'mg'].includes(v)) {
      state.view = v;
      document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.view === v)));
    }
    const h = decodeURIComponent(location.hash.slice(1));
    if (h && nodes.has(h)) { select(h, { center: true, expand: true }); }
    else fit({ minK: 0.62 });
  };
  boot();
  // Fonts may load after first layout; re-render once they are ready.
  document.fonts?.ready.then(() => { render(); if (!state.selected) fit({ minK: 0.62 }); else centerOn(nodes.get(state.selected)); });
})();
</script>
</body>
</html>
