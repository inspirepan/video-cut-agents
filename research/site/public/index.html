<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长视频集锦 Agent 思维导图</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --canvas: #fbfbfc;
  --grid: rgba(0,0,0,.045);
  --fg: #1c1f24;
  --fg-2: #5b6470;
  --fg-3: #8a939e;
  --card: #ffffff;
  --border: rgba(20,24,32,.10);
  --border-2: rgba(20,24,32,.18);
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.06);
  --shadow-lg: 0 2px 6px rgba(0,0,0,.08), 0 18px 48px rgba(0,0,0,.14);
  --accent: #2f6fed;
  --accent-bg: rgba(47,111,237,.10);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, system-ui, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --tag-shared: #3a7bd5;
  --tag-interview: #d9822b;
  --tag-sports: #2aa876;
  --tag-mg: #c2338f;
  --tag-gap: #d94141;
  --tag-atomic: #7b61c8;
  --tag-pitfall: #c2410c;
  --tag-decision: #5d6b7a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a;
    --canvas: #181b20;
    --grid: rgba(255,255,255,.05);
    --fg: #e7eaee;
    --fg-2: #a6afbb;
    --fg-3: #737d8a;
    --card: #1f2329;
    --border: rgba(255,255,255,.10);
    --border-2: rgba(255,255,255,.18);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 18px 48px rgba(0,0,0,.55);
    --accent: #6f9cff;
    --accent-bg: rgba(111,156,255,.16);
    --tag-shared: #6f9cff;
    --tag-interview: #f0a050;
    --tag-sports: #4cc99a;
    --tag-mg: #ef6fc0;
    --tag-gap: #ff6b6b;
    --tag-atomic: #a58cf0;
    --tag-pitfall: #f0834a;
    --tag-decision: #9aa7b5;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  color: var(--fg);
  background: var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .92em; }

/* ---------- app frame ---------- */
#app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
header.bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--card);
  z-index: 5;
}
header .brand { display: flex; flex-direction: column; min-width: 240px; }
header .brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
header .brand .flow { color: var(--fg-2); font-size: 12px; }
header .flow b { color: var(--fg); font-weight: 500; }
header .spacer { flex: 1; }
.search {
  display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-2); border-radius: 8px;
  background: var(--bg); padding: 0 8px; height: 32px; min-width: 300px;
}
.search input { border: 0; background: transparent; outline: 0; color: var(--fg); font: inherit; width: 100%; }
.search .count { color: var(--fg-3); font-size: 12px; white-space: nowrap; }
.search .clear { border: 0; background: transparent; color: var(--fg-3); cursor: pointer; padding: 0 2px; }
.seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 8px; overflow: hidden; height: 32px; }
.seg button { border: 0; background: transparent; padding: 0 10px; cursor: pointer; color: var(--fg-2); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
.btn {
  height: 32px; padding: 0 10px; border: 1px solid var(--border-2); border-radius: 8px; background: var(--card);
  cursor: pointer; color: var(--fg-2); white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.icon { width: 32px; padding: 0; font-size: 16px; line-height: 1; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; color: var(--fg-2); font-size: 12px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.stats { color: var(--fg-3); font-size: 12px; white-space: nowrap; }

main { position: relative; display: grid; grid-template-columns: 1fr 0; transition: grid-template-columns .2s ease; overflow: hidden; }
main.panel-open { grid-template-columns: 1fr 440px; }
@media (max-width: 900px) { main.panel-open { grid-template-columns: 0 1fr; } }

/* ---------- canvas ---------- */
#canvas {
  position: relative; overflow: hidden; background: var(--canvas);
  background-image: radial-gradient(var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  cursor: grab; user-select: none; touch-action: none;
}
#canvas.dragging { cursor: grabbing; }
#viewport { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#links path { fill: none; stroke-width: 1.6; opacity: .85; }
#links path.l1 { stroke-width: 2.4; }
#links path.dim { opacity: .18; }
#nodes { position: absolute; left: 0; top: 0; }

.node {
  position: absolute; display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 9px; background: var(--card); border: 1px solid var(--border);
  box-shadow: var(--shadow); white-space: nowrap; cursor: pointer; font-size: 12.5px; line-height: 1.35;
  transition: opacity .15s ease, box-shadow .15s ease, transform .15s ease;
}
.node[hidden] { display: none; }
.node:hover { border-color: var(--border-2); box-shadow: var(--shadow-lg); }
.node.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
.node.dim { opacity: .28; }
.node.match { box-shadow: 0 0 0 2px var(--c, var(--accent)), var(--shadow); }
.node .bar { width: 4px; align-self: stretch; border-radius: 3px; background: var(--c); margin: -1px 0 -1px -4px; }
.node .title { font-weight: 500; }
.node .num { color: var(--c); font-weight: 600; }
.node .chip {
  font-size: 10px; padding: 0 5px; border-radius: 5px; line-height: 15px; font-weight: 500;
  background: color-mix(in srgb, var(--tag) 14%, transparent); color: var(--tag);
}
.node .meta { color: var(--fg-3); font-size: 10.5px; display: inline-flex; gap: 6px; }
.node .meta b { font-weight: 500; color: var(--fg-2); }
.node .meta.compact { gap: 4px; font-size: 10px; letter-spacing: -.01em; }
.node.depth-1 { font-size: 13.5px; padding: 7px 12px; border-radius: 11px; border-color: color-mix(in srgb, var(--c) 45%, var(--border)); }
.node.depth-1 .title { font-weight: 600; }
.node.depth-3 { font-size: 12px; padding: 4px 9px; background: color-mix(in srgb, var(--card) 92%, var(--c)); }
.node.root {
  flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 18px; border-radius: 14px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, var(--card)), var(--card));
  border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); box-shadow: var(--shadow-lg);
}
.node.root .title { font-size: 16px; font-weight: 700; }
.node.root .sub { font-size: 12px; color: var(--fg-2); }
.node.root .sub b { color: var(--fg); font-weight: 500; }
.node.root .sub2 { font-size: 11px; color: var(--fg-3); }
.node .toggle {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--c); background: var(--card);
  color: var(--c); font-size: 10px; font-weight: 600; line-height: 1; display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
}
.node .toggle:hover { background: var(--c); color: #fff; }
.node.side-right .toggle { right: -11px; }
.node.side-left .toggle { left: -11px; }
.node .ext { color: var(--fg-3); text-decoration: none; font-size: 11px; padding: 0 2px; border-radius: 4px; }
.node .ext:hover { color: var(--accent); background: var(--accent-bg); }
#panel .links { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 10px; }
#panel .links a { font-family: var(--mono); font-size: 11.5px; color: var(--accent); text-decoration: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; background: var(--bg); overflow-wrap: anywhere; }
#panel .links a:hover { border-color: var(--accent); text-decoration: underline; }
.node .dom { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.node .dom.i { background: var(--tag-interview); }
.node .dom.s { background: var(--tag-sports); }
.node .dom.m { background: var(--tag-mg); }

/* ---------- detail panel ---------- */
#panel {
  border-left: 1px solid var(--border); background: var(--card); overflow-y: auto; overflow-x: hidden;
  padding: 16px 18px 40px; font-size: 13px; display: none;
}
main.panel-open #panel { display: block; }
#panel .crumbs { color: var(--fg-3); font-size: 11.5px; display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
#panel .crumbs a { color: var(--fg-2); cursor: pointer; }
#panel .crumbs a:hover { color: var(--accent); text-decoration: underline; }
#panel h2 { margin: 0 0 6px; font-size: 17px; font-weight: 650; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#panel .close { position: sticky; top: 0; float: right; margin: -6px -8px 0 0; border: 0; background: transparent; font-size: 18px; color: var(--fg-3); cursor: pointer; }
#panel .close:hover { color: var(--fg); }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px; font-weight: 500; background: color-mix(in srgb, var(--tag) 14%, transparent); color: var(--tag); }
.chip.i { --tag: var(--tag-interview); }
.chip.s { --tag: var(--tag-sports); }
.chip.m { --tag: var(--tag-mg); }
#panel .summary { font-size: 14px; color: var(--fg); margin: 0 0 10px; }
#panel section { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); }
#panel section h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
#panel section h3 .n { background: var(--bg); border-radius: 5px; padding: 0 5px; font-weight: 500; }
#panel p { margin: 0 0 6px; }
#panel ul { margin: 0; padding-left: 16px; }
#panel li { margin: 3px 0; }
.io { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.io h4, .dom-cards h4 { margin: 0 0 3px; font-size: 11.5px; color: var(--fg-2); font-weight: 600; }
.io ul { font-size: 12.5px; }
.dom-cards { display: grid; gap: 8px; }
.dom-card { border-radius: 8px; padding: 8px 10px; border: 1px solid var(--border); background: var(--bg); }
.dom-card.i { border-left: 3px solid var(--tag-interview); }
.dom-card.s { border-left: 3px solid var(--tag-sports); }
.dom-card.m { border-left: 3px solid var(--tag-mg); }
.dom-card.focus { background: color-mix(in srgb, var(--accent) 6%, var(--bg)); }
.item { padding: 7px 0; border-top: 1px dashed var(--border); }
.item:first-of-type { border-top: 0; }
.item .t { font-weight: 600; }
.item .impl { color: var(--accent); font-family: var(--mono); font-size: 11.5px; margin-left: 6px; }
.item .d { color: var(--fg-2); margin-top: 2px; }
.item .src { margin-top: 3px; }
.path {
  display: inline-block; font-family: var(--mono); font-size: 11.5px; color: var(--fg-2); background: var(--bg);
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; cursor: copy; max-width: 100%;
  overflow-wrap: anywhere; white-space: normal;
}
.path:hover { border-color: var(--accent); color: var(--accent); }
.path .ln { color: var(--fg-3); }
.kids { display: flex; flex-wrap: wrap; gap: 6px; }
.kids button { border: 1px solid var(--border); background: var(--bg); border-radius: 7px; padding: 3px 9px; cursor: pointer; font-size: 12px; }
.kids button:hover { border-color: var(--accent); color: var(--accent); }
.hint { color: var(--fg-3); font-size: 11.5px; margin-top: 16px; }
#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--fg); color: var(--bg); padding: 7px 12px; border-radius: 8px; font-size: 12px; pointer-events: none;
  transition: all .18s ease; z-index: 20;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#help {
  position: absolute; left: 12px; bottom: 12px; color: var(--fg-3); font-size: 11.5px; background: color-mix(in srgb, var(--card) 85%, transparent);
  padding: 6px 9px; border-radius: 8px; border: 1px solid var(--border); pointer-events: none;
}
#zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">
      <h1>长视频集锦 Agent · 思维导图</h1>
      <div class="flow"><b>原视频理解</b> → <b>LLM 按意图写脚本</b> → <b>Agent 选片 + 本地搜 BGM</b> → <b>合成视频</b>　·　右侧是集锦主流程，左侧是产品方向、工程交付和跨流程公共能力；第三个方向 <b>MG 动效制作（图形动画）</b> 单独一支</div>
    </div>
    <div class="spacer"></div>
    <div class="search">
      <span aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="搜索：回放、Beat This、fade、AGPL、比分 …（Enter 跳到下一个）" aria-label="搜索节点">
      <span class="count" id="qcount"></span>
      <button class="clear" id="qclear" title="清除" aria-label="清除搜索">✕</button>
    </div>
    <div class="seg" role="group" aria-label="视角">
      <button data-view="all" aria-pressed="true">全部</button>
      <button data-view="interview" aria-pressed="false">访谈视角</button>
      <button data-view="sports" aria-pressed="false">赛事视角</button>
      <button data-view="mg" aria-pressed="false">MG 视角</button>
    </div>
    <div class="seg" role="group" aria-label="展开层级">
      <button data-depth="1" title="只显示一级分支">L1</button>
      <button data-depth="2" title="展开到二级">L2</button>
      <button data-depth="3" title="展开到三级">L3</button>
      <button data-depth="99" title="全部展开">全部</button>
    </div>
    <button class="btn" id="fit" title="适应屏幕 (F)">适应屏幕</button>
    <div class="legend" id="legend"></div>
    <div class="stats" id="stats"></div>
  </header>
  <main id="main">
    <div id="canvas">
      <div id="viewport">
        <svg id="links"></svg>
        <div id="nodes"></div>
      </div>
      <div id="help">拖动平移 · 滚轮平移 · ⌘/Ctrl+滚轮或双指缩放 · 点节点看详情 · 点圆点展开/折叠 · Esc 关闭</div>
      <div id="zoomctl">
        <button class="btn icon" id="zin" title="放大">+</button>
        <button class="btn icon" id="zout" title="缩小">−</button>
      </div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>
<div id="toast" role="status"></div>

<script>
const DATA = {"root": {"title": "长视频集锦 Agent", "subtitle": "<b>原视频理解<\/b> → <b>LLM 按意图写脚本<\/b> → <b>选片 + 本地 BGM<\/b> → <b>合成视频<\/b>", "note": "长访谈 · 体育赛事 · MG 动效 · 35 个本地实现仓库 + 2 个云端 Skill 包 · 2026-09-06"}, "branches": [{"id": "ingest", "title": "素材接入与规范化", "tag": "shared", "summary": "把长视频变成可寻址、可复现、可断点续跑的工程输入", "goal": "长访谈和赛事原片通常是大文件：帧率不固定（VFR）、高动态范围（HDR）、带旋转标记、有多条音轨。不做预处理就直接剪，声音和画面会逐渐错位，切点可能落在错误的帧上，缓存也会失效。这一步产出探测清单（manifest）、内容哈希、统一的时间基准和各阶段的断点存档（checkpoint）。", "inputs": ["用户提供的原始视频/音频文件", "yt-dlp 下载产物", "多台相机同时拍摄的素材与外接麦克风录音"], "outputs": ["探测清单（probe manifest）JSON", "内容哈希与规范资产映射（同一内容只存一份）", "CFR（恒定帧率）规范化的中间文件与低码率代理（低分辨率草稿副本）", "project 目录与各阶段的断点存档（checkpoint）"], "interview": "访谈常有多台相机和外接麦克风。独立录音设备工作超过 10 分钟会出现时钟漂移，必须先校正；否则录到一小时左右，口型和声音会明显对不上。", "sports": "转播源常是 50/60fps 且关键帧间隔大。降到 30fps 会让快速动作明显卡顿，必须保留高帧率并按整数帧对齐。", "mg": "接入的不是拍摄原片。MG 动效（Motion Graphics，图形动画）的素材采集是 Playwright 三件套：2 倍分辨率的全页截图、每个元素单独的透明背景截图、layout.json 坐标表。", "atomic": [{"name": "媒体探测", "impl": "ffprobe → probe.py 结构化 manifest", "note": "输出 fps、r/avg_frame_rate、rotation、hdr_format、bit_depth、audio_streams"}, {"name": "CFR 规范化", "impl": "ffmpeg -fps_mode cfr -r <avg>", "note": "只在检测到 VFR 或显式指定 fps 时才插入，避免不必要的重新编码"}, {"name": "内容寻址", "impl": "SHA-256 全文件哈希", "note": "内容哈希相同的文件直接复用已有资产和派生缓存；文件名相同但内容不同则直接报错"}, {"name": "代理生成", "impl": "video-edit-cli proxy create --height", "note": "低分辨率副本只用于快速定位与人工审阅，不参与最终渲染"}, {"name": "阶段断点存档", "impl": "step_id + input_hash 的 JSON 台账", "note": "input_hash 一变就失效，避免换了模型还重放旧的产物"}], "pitfalls": [{"title": "容器时长不等于画面时长", "detail": "format.duration 经常继承更长的音轨时长或 MP4 的播放顺序表（edit list），按它排时间线会在尾部出现黑帧。应该改用视频流自己的 duration。", "source": "ClipTalk/app/media.py:184"}, {"title": "截断文件仍能被 ffprobe 读出", "detail": "MP4 的元数据在文件被截断后仍然可读，ffprobe 会报告原来的时长，但后面的数据包已经不存在。需要在文件尾部开一个小窗口做多点 framehash 解码探测；整段都解不出来就拒绝导入，而不是悄悄缩短时间线。", "source": "ClipTalk/app/media.py:222"}, {"title": "VFR 素材直接剪会音画错位", "detail": "手机和录屏素材的 r_frame_rate 与 avg_frame_rate 不一致。不先转成 CFR 就直接剪切、拼接，声音和画面会随时间累积错位。探测到这种情况就自动加上 -fps_mode cfr。", "source": "kajisho5-ffmpeg-skill/SKILL.md:191"}, {"title": "-c copy 可能切出静止首帧", "detail": "不重编码的切法只能从关键帧（可独立解码的帧）开始。关键帧间隔大时，实际起点可能比指定时间早 1–10 秒：文件能播放，但开头画面是错的。偏差超过 0.5s 就必须改成重新编码。", "source": "kajisho5-ffmpeg-skill/SKILL.md:177"}, {"title": "重编码悄悄丢音轨", "detail": "iPhone 拍摄的 .mov 文件带有时间码（timecode）和多条音轨，脚本默认只映射第一条音频，重新编码后其余音轨会消失。要先看探测结果中的 audio_streams 再决定映射。", "source": "kajisho5-ffmpeg-skill/SKILL.md:141"}], "refs": [{"repo": "kajisho5-ffmpeg-skill", "path": "kajisho5-ffmpeg-skill/scripts/_common.py", "line": 282, "why": "VFR 判定阈值和探测字段的真实实现"}, {"repo": "kajisho5-ffmpeg-skill", "path": "kajisho5-ffmpeg-skill/SKILL.md", "line": 189, "why": "VFR/HDR/旋转/关键帧四类接入陷阱清单"}, {"repo": "chatmonteur", "path": "chatmonteur/docs/architecture.md", "line": 90, "why": "raw 不可变、clips 为 CFR 中间文件的阶段表"}, {"repo": "video-edit-cli", "path": "video-edit-cli/skills/video-edit-cli/references/workspace.md", "line": 34, "why": "workspace.json 记录 sha256 与角色的目录契约"}, {"repo": "ClipTalk", "path": "ClipTalk/app/media.py", "line": 161, "why": "probe_video 对多种 duration 来源的取舍逻辑"}], "children": [{"id": "probe-normalize", "title": "媒体探测与规范化", "tag": "shared", "summary": "先探测再动手，把格式各异的原片统一成可预测的中间文件", "goal": "不探测就开工是所有静默失败的源头。这一步把帧率、色彩、旋转、音轨等信息都写进探测清单（manifest）的字段，并且只在必要时做一次重新编码。", "inputs": ["原始媒体文件"], "outputs": ["探测清单（manifest），含 video/audio/subtitle_streams", "CFR（恒定帧率）+ SDR（普通动态范围）规范化的中间文件", "代理文件（proxy，低分辨率草稿副本）"], "interview": "长访谈普遍是 SDR 1080p、多音轨。重点是音轨映射和设备间的时钟漂移（录音随时间逐渐错位），不是色彩。", "sports": "转播源可能是 HDR（高动态范围）HLG 或 BT.2020。优先保留高帧率，色彩转换要放在流程最前面，不要等剪完再补。", "atomic": [{"name": "probe manifest", "impl": "kajisho5 probe.py / montaj probe step", "note": "montaj 会额外输出 display_width/height 和 rotation，用来区分编码尺寸与显示尺寸"}, {"name": "Log 素材识别", "impl": "probe.py --analyze 输出 looks_like_log", "note": "Log 是相机拍的低对比度原始格式，S-Log/V-Log 常被误标成 SDR；需要先套调色查找表（.cube）再做其它处理"}, {"name": "设备同步", "impl": "sync.py --fix-drift", "note": "confidence < 0.3 或偏移量超过分析窗口的 60% 时，视为同步失败"}], "pitfalls": [{"title": "60fps 降 30 让动作明显卡顿", "detail": "把 60fps 转成 30fps 会少掉一半运动采样。人物讲话特写看不出来，但体育、游戏和无人机横摇画面会明显卡顿。平台允许就保留 60fps。", "source": "kajisho5-ffmpeg-skill/SKILL.md:186"}, {"title": "HDR 走 SDR 路径颜色发灰", "detail": "在 BT.2020 像素上错误地打上 BT.709 标签，会直接洗掉画面颜色。需要 zscale→linear(npl=100)→tonemap=hable:desat=0→BT.709 这条完整处理链，其中 tonemap 是把 HDR 压成 SDR 的色调映射。", "source": "premiere-agent/helpers/visual_lane.py:452"}], "refs": [{"repo": "kajisho5-ffmpeg-skill", "path": "kajisho5-ffmpeg-skill/scripts/_common.py", "line": 409, "why": "cfr_args 只在检测到 VFR（可变帧率）时才插入 -fps_mode cfr"}, {"repo": "montaj", "path": "montaj/steps/media/probe.json", "line": 10, "why": "displaymatrix 旋转与编码尺寸分离的输出契约"}, {"repo": "video-edit-cli", "path": "video-edit-cli/docs/reference.md", "line": 133, "why": "proxy create --height 的代理生成命令"}], "children": [{"id": "vfr-cfr", "title": "VFR 转 CFR", "tag": "atomic", "summary": "r/avg 帧率相差超过 0.01 就判定为 VFR（可变帧率），并强制转成 CFR（恒定帧率）", "goal": "VFR 素材在剪切和拼接后会与音频逐渐错位。把帧率规范化成整数或接近整数的 CFR，是后续所有帧级操作的前提。", "outputs": ["用 -fps_mode cfr -r <rate> 生成的中间文件"], "atomic": [{"name": "VFR 判定", "impl": "abs(r_frame_rate - avg_frame_rate) > 0.01", "note": "命中判定就把 variable_frame_rate_suspected 置为 True"}, {"name": "速率取整", "impl": "abs(rate-round(rate))<0.02 时取整", "note": "掉帧导致的 23.4fps 这类非标准帧率，需要人工指定 --fps 30|60"}], "pitfalls": [{"title": "VFR 素材用 copy 模式剪切不可靠", "detail": "cut.py 检测到 VFR 会自动切换到 --accurate 重新编码模式。手写 ffmpeg 命令时容易忘记这一点，结果就是片段能播放但起点是错的。", "source": "kajisho5-ffmpeg-skill/SKILL.md:193"}], "refs": [{"repo": "kajisho5-ffmpeg-skill", "path": "kajisho5-ffmpeg-skill/scripts/_common.py", "line": 416, "why": "cfr_args 的判定与取整实现"}, {"repo": "chatmonteur", "path": "chatmonteur/skills/production-rules.md", "line": 14, "why": "剪之前先重建 CFR 中间文件的硬规则"}]}, {"id": "color-hdr", "title": "HDR 与 Log 色彩", "tag": "atomic", "summary": "色彩转换必须排在剪辑链条最前面", "goal": "HDR（高动态范围）、Dolby Vision 和 Log（相机低对比度原始格式）素材如果先剪后转，或者被打了错误的标签，颜色会不可逆地丢失。", "outputs": ["SDR BT.709 yuv420p 中间文件，或保留 HDR 的 HEVC Main10"], "atomic": [{"name": "HDR 判定", "impl": "color_transfer ∈ {smpte2084, arib-std-b67} 或 primaries=bt2020", "note": "side_data 里有 dv_profile 时，即使基础层标签缺失也算 HDR"}, {"name": "tonemap 链", "impl": "zscale/tonemap=hable", "note": "tonemap 是把 HDR 压成 SDR 的色调映射；hable 能保住高光又不洗白暗部，比 mobius/reinhard 更适合混合内容"}], "pitfalls": [{"title": "Log 素材被当成正常 SDR", "detail": "S-Log/V-Log/C-Log 素材画面发灰，但元数据标签是 SDR（普通动态范围），直接调色会造成二次压缩。要先跑 probe --analyze 看 looks_like_log 字段，再用厂商提供的调色查找表（.cube）。", "source": "kajisho5-ffmpeg-skill/SKILL.md:211"}], "refs": [{"repo": "premiere-agent", "path": "premiere-agent/helpers/visual_lane.py", "line": 441, "why": "HDR→SDR 六段 tonemap 链的完整注释与参数"}, {"repo": "kajisho5-ffmpeg-skill", "path": "kajisho5-ffmpeg-skill/scripts/_common.py", "line": 296, "why": "hdr_format 区分 HDR10/PQ、HLG、Dolby Vision"}]}, {"id": "proxy-tracks", "title": "代理文件与多音轨", "tag": "shared", "summary": "低码率代理（低分辨率草稿副本）供理解与审阅，原片只在最终渲染时出场", "goal": "长素材反复定位（seek）和按固定间隔抽帧的代价很高。代理文件让理解阶段变快；多音轨则决定 ASR 用哪一条。", "outputs": ["proxies/ 下的低分辨率副本", "选定的 audio-stream 索引"], "interview": "先用 --audio-stream 挑领夹麦克风，而不是相机机头上的麦克风；两种来源的 ASR 词级时间戳质量差别很大。", "sports": "解说音轨和现场音轨通常是分开的。解说轨用于 ASR，现场轨用于欢呼能量检测，两条都要保留。", "atomic": [{"name": "音轨选择", "impl": "audio.py --audio-stream N", "note": "探测结果的 audio_streams 列出多条音轨时，必须显式指定用哪一条"}, {"name": "统一采样率", "impl": "ffmpeg -ac 1 -ar 16000 / 48000", "note": "语音识别链用 16k 单声道，CLAP 声音事件链用 48k"}], "pitfalls": [{"title": "不要为转写先手动导出 WAV", "detail": "baocut 的 transcribe 自带 16kHz 单声道降混，9GB / 96 分钟的 4K 源解码只需约 34 秒。手动预先导出 WAV 只会多一份中间文件和一次质量损失。", "source": "baocut/skills/baocut/references/workflows.md:202"}], "refs": [{"repo": "kajisho5-ffmpeg-skill", "path": "kajisho5-ffmpeg-skill/SKILL.md", "line": 141, "why": "多音轨用 --audio-stream N 选择"}, {"repo": "premiere-agent", "path": "premiere-agent/AGENT.md", "line": 69, "why": "audio_16k/ 把 16kHz PCM 共享给语音和 CLAP 两条处理线（lane）"}]}]}, {"id": "content-hash", "title": "内容哈希与派生缓存", "tag": "shared", "summary": "用 SHA-256 做资产身份，原片不可变，派生物全部可重算", "goal": "同一段访谈可能被多次导入、改名、剪出多个版本。必须用内容哈希而不是文件路径 .5MB", "note": "两个模型共约 32MB，--speakers N 作为声纹簇数量的上限"}, {"name": "声纹检索", "impl": "iic/speech_campplus_sv_zh-cn_16k-common", "note": "accept 阈值 0.38，review 阈值 0.31，次优候选的间距阈值 0.05"}, {"name": "说话人修复", "impl": "speaker-repair 任务，逐词编号窗口", "note": "只允许合并碎片或小幅移动边界；重标超过 12 个词或 2.5s 的修改会被引擎直接忽略"}], "pitfalls": [{"title": "碎片被误判成新说话人", "detail": "说话人分离会把“的/了/吗”这种补足邻句的碎片单独切成一轮。baocut 的做法是先按语义和语法判断再看时间，并硬性限制修复不得增加轮次数量。", "source": "baocut/skills/baocut/references/agent-tasks.md:619"}, {"title": "声纹合并阈值要显式调", "detail": "ClipTalk 把 CAM++ 聚类后端的 merge_thr 显式设为 0.82，而不是用默认值，并把 VAD（语音活动检测）边界作为聚类切分的依据；否则同一个人会被拆成多个标签。", "source": "ClipTalk/app/speech.py:207"}], "refs": [{"repo": "premiere-agent", "path": "premiere-agent/helpers/diarize.py", "line": 89, "why": "按最大重叠给每个词打 speaker_id"}, {"repo": "ClipTalk", "path": "ClipTalk/app/voiceprint.py", "line": 21, "why": "声纹模型与三档判定阈值"}, {"repo": "baocut", "path": "baocut/skills/baocut/references/workflows.md", "line": 213, "why": "MOSS 自带说话人分离，Qwen/Whisper 需要外挂 diarization 包"}, {"repo": "OpenChatCut", "path": "OpenChatCut/src/agent/skills/livestream-to-clips/references/profile-matrix.md", "line": 11, "why": "访谈要求保留问题、答案依赖问题时不得单独切出"}]}, {"id": "shot-visual", "title": "镜头切分与视觉语义", "tag": "shared", "summary": "先切镜头，再在镜头内按预算抽帧（按固定间隔取画面帧）做描述、质量分与 OCR", "goal": "镜头是视觉索引的最小单位。均匀抽帧会漏掉短镜头，又在长镜头里浪费预算；按镜头感知来抽帧，能用更少的帧覆盖更多内容。", "inputs": ["CFR（恒定帧率）中间文件或代理（低分辨率草稿副本）"], "outputs": ["shots[] 含 start/end/keyframeTimes", "每帧的画面描述（caption）与美学分", "OCR 文本单元"], "interview": "访谈画面变化少，1fps 甚至 0.5fps 就足够。重点是识别补充画面（B-roll，空镜和资料镜头）和检查镜头连续性。", "sports": "转播切镜频繁而且镜头短。镜头检测的阈值要更灵敏，慢放和特写要能与直播镜头区分开。", "atomic": [{"name": "学习式镜头切分", "impl": "TransNetV2，25fps 采样，阈值 0.5", "note": "最短镜头 1000ms，最长 30000ms 强制再切"}, {"name": "纯 ffmpeg 切分", "impl": "select='gt(scene,0.25)',showinfo", "note": "无模型依赖，montaj 默认 0.25、最短镜头 0.4s；ClipTalk 阈值夹在 0.1–0.9"}, {"name": "镜头内抽帧", "impl": "shot_sample_times(maximum_per_shot=6, global_limit=1200)", "note": "每镜头取首/中/尾三帧，长镜头每 8 秒补一帧，首尾帧为必选"}, {"name": "帧预算分档", "impl": "coarse_frame_limit", "note": "≤10min 取 48–72 帧，30min 96，1h 120，2h 150，更长 180"}], "pitfalls": [{"title": "1fps 描述会淹没时间轴", "detail": "Florence-2 每秒输出 5–7 句描述，按 1fps 跑三小时就是一万条。对话式或静态内容应降到 0.5fps 或 0.25fps，成本随 fps 线性增长。", "source": "premiere-agent/helpers/visual_lane.py:95"}, {"title": "默认过滤规则会保留 80% 素材", "detail": "FireRed 的 filter 提示词强制保留超过 80% 的 clip，这只是“去掉明显废片”，不是为脚本的节拍点（beat）做竞争性选片。直接复用会让集锦毫无取舍。", "source": "FireRed-OpenStoryline/prompts/tasks/filter_clips/zh/system.md"}], "refs": [{"repo": "FireRed-OpenStoryline", "path": "FireRed-OpenStoryline/src/open_storyline/nodes/core_nodes/split_shots.py", "line": 35, "why": "TransNetV2 采样率、阈值与镜头时长约束"}, {"repo": "ClipTalk", "path": "ClipTalk/app/recognition.py", "line": 135, "why": "镜头感知抽帧的每镜头与全局上限"}, {"repo": "montaj", "path": "montaj/steps/media/detect_shots.json", "line": 14, "why": "纯 ffmpeg 镜头检测的阈值与最短镜头默认值"}, {"repo": "ClipTalk", "path": "ClipTalk/app/pipeline.py", "line": 126, "why": "按时长分五档的粗筛帧预算"}], "children": [{"id": "vlm-caption", "title": "VLM 描述与质量分", "tag": "shared", "summary": "客观描述加美学分和技术分，描述长度必须设上限", "goal": "画面描述（caption）既要足够具体、能支撑选片，又不能长到撑爆 token。同时还需要一个与内容无关的画质分，用来淘汰废片。", "outputs": ["clip_captions[].caption", "美学分（aesthetic score）"], "atomic": [{"name": "本地 caption", "impl": "Florence-2-base, <MORE_DETAILED_CAPTION>, batch 8", "note": "768x768 方形中心裁剪，lanczos 缩放，rgb24 流式输入"}, {"name": "云端 clip 理解", "impl": "VLM 逐 clip，sample_fps=2.0, max_frames=64", "note": "max_frames 是防止长视频撑爆 token 的兜底限制"}, {"name": "描述压缩", "impl": "caveman_compress.py（spaCy 去虚词）", "note": "token 量下降 55–60%，实体、动作、颜色、构图信息全部保留"}], "pitfalls": [{"title": "静态画面产生大量重复描述", "detail": "逐帧生成的描述在静止镜头上几乎逐字重复。打包（pack）时做句级模糊增量去重：相似度 ≥0.80 视为已经见过，静态帧折叠成 (same)，缓慢变化的帧只输出新增的句子。", "source": "premiere-agent/helpers/pack_timelines.py:366"}], "refs": [{"repo": "premiere-agent", "path": "premiere-agent/helpers/visual_lane.py", "line": 98, "why": "默认 fps、batch size 与 Florence 输入尺寸常量"}, {"repo": "FireRed-OpenStoryline", "path": "FireRed-OpenS yline", "path": "FireRed-OpenStoryline/src/open_storyline/nodes/core_nodes/select_bgm.py", "line": 45, "why": "召回→过滤→LLM 选一首→librosa 提取特征的完整实现"}, {"repo": "OpenChatCut", "path": "OpenChatCut/src/agent/skills/music-intelligence/SKILL.md", "line": 11, "why": "Beat This+CLAP 本地分析与节拍对齐工具的调用契约"}, {"repo": "video-shotcraft", "path": "video-shotcraft/references/music-beat-sync.md", "line": 1, "why": "从选曲到切点误差 ≤3 帧的可复现节拍对齐方法论"}, {"repo": "chatmonteur", "path": "chatmonteur/skills/references/final-render-and-audio.md", "line": 24, "why": "EQ 缺口、温和闪避与混音电平的实测定稿参数"}, {"repo": "video-edit-cli", "path": "video-edit-cli/src/video_editor/audio/mastering.py", "line": 17, "why": "两遍 loudnorm 的确定性实现与默认目标值"}], "children": [{"id": "music-library", "title": "本地曲库索引", "tag": "shared", "summary": "把目录里的音频变成可过滤、可向量召回的结构化条目。", "goal": "Agent 无法直接听音频。必须先把每首曲子变成带标签和描述文本的结构化条目，语义召回和硬条件过滤才有工作基础。", "inputs": ["本地 BGM 目录 bgm_dir"], "outputs": ["meta.json：List[Dict]，含 id/path/description/mood/scene/genre/lang", "FAISS 向量库", "ledger.jsonl 授权记录与 SHA-256"], "atomic": [{"name": "条目表 meta.json", "impl": "ElementFilter(json_path=f\"{bgm_dir}/meta.json\")", "note": "必须是 list of dict，否则直接抛 ValueError；include 用 AND、同维度多值用 OR"}, {"name": "标签枚举", "impl": "SelectBGMInput.filter_include", "note": "mood 9 值、scene 12 值、genre 10 值、lang 5 值（bgm/en/zh/ko/ja）、id 精确指定"}, {"name": "向量库构建", "impl": "HuggingFaceEmbeddings + FAISS.from_documents", "note": "模型先找 ./.storyline/models/all-MiniLM-L6-v2，缺失回落 sentence-transformers 官方权重，device=cpu"}, {"name": "授权记录", "impl": "assets/sound/ledger.jsonl", "note": "licence 和 SHA-256 是每个内置文件的权威来源；user/ 本地投放目录优先级最高，且不纳入版本库"}], "interview": "访谈曲库要标注 vocal=instrumental。有歌词的曲子一律排除，因为歌词人声会和说话声冲突。", "sports": "赛事曲库要备有 usage=sports、mood=energetic 的高能曲目段落，并标注哪些可循环。", "pitfalls": [{"title": "description 为空建不出库", "detail": "build_vectorstore 只嵌入 description 字段；全空时只打印一行日志并返回 None，整条召回链静默失效。入库脚本必须强制写入描述文本。", "source": "FireRed-OpenStoryline/src/open_storyline/utils/recall.py:42"}, {"title": "过滤为空会随机兜底", "detail": "ElementFilter.filter 结果为空时会用 random.sample 随机抽 10 首返回，用户的硬条件（例如无歌词）被静默丢弃。要么设 fallback_n=0，要么自己判空并报错。", "source": "FireRed-OpenStoryline/src/open_storyline/utils/element_filter.py:80"}, {"title": "批量下载丢失来源", "detail": "从 Mixkit 等站点批量下载后，metadata 常被抹掉，事后无法反查曲名与授权，商用前必须人工复核。下载时就应把曲名和 URL 写进条目。", "source": "video-shotcraft/references/sound-design.md:52"}], "refs": [{"repo": "FireRed-OpenStoryline", "path": "FireRed-OpenStoryline/src/open_storyline/utils/element_filter.py", "line": 50, "why": "include/exclude 过滤与随机兜底的实现"}, {"repo": "FireRed-OpenStoryline", "path": "FireRed-OpenStoryline/src/open_storyline/utils/recall.py", "line": 7, "why": "本地 embedding 建 FAISS 库的最小实现"}, {"repo": "FireRed-OpenStoryline", "path": "FireRed-OpenStoryline/src/open_storyline/nodes/node_schema.py", "line": 323, "why": "mood/scene/genre/lang 四个标签维度的取值枚举"}, {"repo": "chatmonteur", "path": "chatmonteur/skills/sound.md", "line": 14, "why": "曲库目录结构与 ledger.jsonl 授权权威"}]}, {"id": "music-pick", "title": "语义选曲与硬过滤", "tag": "shared", "summary": "向量召回 32 首 → 标签硬过滤 → LLM 只返回一条 JSON。", "goal": "用户的选曲意图是自然语言（如激情、有鼓点），但 BPM 范围、无歌词这类硬条件不能交给 LLM 判断。整个流程要分成召回、过滤、择一三段。", "inputs": ["user_request 自然语言", "filter_include / filter_exclude", "FAISS 向量库"], "outputs": ["选中条目 {id, path, ...}"], "atomic": [{"name": "全量召回", "impl": "StorylineRecall.query_top_n(k=32)", "note": "similarity_search 返回 doc.metadata 原始 dict，保留全部字段供后续过滤"}, {"name": "硬条件过滤", "impl": "ElementFilter include/exclude", "note": "BPM 区间、lang=bgm（无歌词）这类硬条件在这里过滤，不进 prompt"}, {"name": "LLM 择一", "impl": "temperature=0.1, top_p=0.9, max_tokens=2048", "note": "system prompt 只有一句要求：返回最适合的、有且只有一条 JSON"}, {"name": "解析降级", "impl": "parse_json_dict + 首条兜底", "note": "解析失败或结果无 path 字段时直接取 candidates[0]，避免整条链路挂掉"}], "interview": "访谈的选曲判据是不抢戏：选低瞬态的 pad（铺垫音）或 ambient（氛围音乐），能量曲线平缓，允许长时间铺底。", "sports": "赛事选强鼓点的电子乐底（tech-house 类），能量曲线要能托住集锦的推进结构。", "pitfalls": [{"title": "单听曲子选型不可靠", "detail": "实测中曲目三易其稿：v1 到 v2 只隔 22 分钟就被否决，根因是选曲时没有在成片语境里试听。候选曲必须垫进成片里试听后再定。", "source": "video-shotcraft/references/sound-design.md:40"}, {"title": "静音选项必须显式记录", "detail": "OpenMontage 把 music_plan 设为强制字段：只有当用户明确 opt-out 并写下说明时，source 才能是 none，否则 review 不通过。默认无音乐会被当成漏做。", "source": "OpenMontage/pipeline_defs/documentary-montage.yaml:57"}, {"title": "选一次就固化成频道主题", "detail": "把一次搜索出来的曲子当成常驻品牌音乐是错的。要按 brand 的 sound.json 分成三支：已批准默认、custom_sections、no_music，并把选择写回 PLAN.md。", "source": "chatmonteur/skills/sound.md:32"}], "refs": [{"repo": "FireRed-OpenStoryline", "path": "FireRed-OpenStoryline/src/open_storyline/nodes/core_nodes/select_bgm.py", "line": 62, "why": "召回→过滤→LLM→降级四步的完整 recommend"}, {"repo": "FireRed-OpenStoryline", "path": "FireRed-OpenStoryline/prompts/tasks/select_bgm/zh/system.md", "line": 1, "why": "选曲 prompt 的硬规则：只返回一条 JSON"}, {"repo": "chatmonteur", "path": "chatmonteur/skills/sound.md", "line": 22, "why": "选曲铁律：绝不用带人声的曲子"}, {"repo": "video-shotcraft", "path": "video-shotcraft/references/sound-design.md", "line": 42, "why": "从用户原话反推的选型判据"}]}, {"id": "music-analysis", "title": "音乐结构分析", "tag": "shared", "summary": "测定 BPM、beat、downbeat（每小节第一拍）、能量与段落，产出可审计的分析结果。", "goal": "对齐节拍、段落编排、音乐进出场都依赖同一份时间数据。这份数据必须以浮点秒记录、留档、可复算，不能在管线中被反复取整。", "inputs": ["选中曲目音频文件"], "outputs": ["beat_data.json：bpm/t0/T/beats/hits[{t,s,k}]/rms/sections", "grid_drift.json：各候选节拍网格的 match、误差、漂移与获胜理由"], "atomic": [{"name": "轻量特征（librosa）", "impl": "sr=22050, hop=2048, frame=2048", "note": "onset_strength → beat_track → RMS；dynamic_range_db 取 p95−p10，energy 用 amplitude_to_db"}, {"name": "强拍局部归一化", "impl": "_compute_accent_beats", "note": "percussive onset，8 拍窗均值归一，top_pct=70，require_local_peak，min_sep_beats=1，输出毫秒整数"}, {"name": "神经节拍（Beat This）", "impl": "ONNX，22050 Hz / n_fft 1024 / hop 441 / 128 mel", "note": "chunk 1500 帧、border 6 帧；峰值半径 3、去重宽 2；WebGPU 优先，>128 MB 或失败回落 WASM"}, {"name": "BPM 与拍号推导", "impl": "estimateBpm / estimateMeter", "note": "beat 间隔先去掉 IQR 1.5 倍以外的离群值再取中位数；拍号按相邻 downbeat（小节第一拍）之间的 beat 数取中位，钳制在 1–12"}, {"name": "段落切分", "impl": "deriveMusicSections（energy-change-v1）", "note": "每拍 RMS 归一 → 前后 3 拍均值差 → 阈值 clamp(0.12,0.3)；最短段 4000 ms，最多 12 段"}, {"name": "语义标签（CLAP）", "impl": "clap-prototypes.json，4 类各 8 标签", "note": "genre/mood/instrument/usage；余弦分 <0.2 记 unknown；512 维 embedding 只留缓存，绝不进 LLM 上下文"}], "interview": "访谈只需要能量曲线和段落边界，用来决定音乐的进出场，不需要逐拍的 downbeat（小节第一拍）。", "sports": "赛事集锦需要 downbeat（小节第一拍）和 peak 段落，用来把得分镜头对齐在小节头上。", "pitfalls": [{"title": "复杂编曲鼓点被埋", "detail": "人声、贝斯厚重的曲子会掩盖鼓点起音，beat_track 和 onset 的检测结果都会漂移。先用 librosa.effects.hpss 提取打击乐成分；仍不干净时用 Demucs --two-stems=drums 分离出鼓轨，后续全部在 drums.wav 上测量。", "source": "video-shotcraft/references/music-beat-sync.md:58"}, {"title": "命中表被当触发器", "detail": "tech-house 类曲子几乎每拍都有底鼓（kick），逐个 kick 配画面冲击会让镜头跟着节奏抖动（真实用户投诉过）。kick 表只是候选池，全片冲击 ≤3 处。", "source": "video-shotcraft/references/music-beat-sync.md:93"}, {"title": "提前取整让误差滚雪球", "detail": "分析全程必须用浮点秒记录，换算成帧号只发生在进入渲染器的最后一步。beat_data.json 里的时刻永远不做预取整。", "source": "video-shotcraft/references/music-beat-sync.md:25"}, {"title": "曲子太短直接抛错", "detail": "librosa 路径在 y.size < frame_length 时抛 RuntimeError；音频读不了会回落 ffmpeg 转 wav 再读，ffmpeg 缺失才最终失败。", "source": "FireRed-OpenStoryline/src/open_storyline/nodes/core_nodes/select_bgm.py:125"}], "refs": [{"repo": "FireRed-OpenStoryline", "path": "FireRed-OpenStoryline/src/open_storyline/nodes/core_nodes/select_bgm.py", "line": 220, "why": "强拍局部归一化与峰值筛选的全部参数"}, {"repo": "OpenChatCut", "path": "OpenChatCut/src/audio/intelligence/beatThisPreprocess.ts", "line": 1, "why": "Beat This 前处理常量：采样率/hop/mel/chunk"}, {"repo": "OpenChatCut", "path": "OpenChatCut/src/audio/intelligence/beatThisClient.ts", "line": 132, "why": "BPM 去离群、拍号中位、置信度加权公式"}, {"repo": "OpenChatCut", "path": "OpenChatCut/src/audio/intelligence/sections.ts", "line": 19, "why": "能量变化分段的阈值、最短段长与角色判定"}, {"repo": "video-shotcraft", "path": "video-shotcraft/references/music-beat-sync.md", "line": 114, "why": "网格验收四指标：match≥98%、误差<10ms、漂移<5ms"}]}, {"id": "music-beatsync", "title": "卡点计划与提交", "tag": "shared", "summary": "把节拍点转换成只读的修改计划，校验通过后一次性提交，并对应单步 undo。", "goal": "对齐节拍会批量修改时间线，必须支持预览和回滚。计划与执行分离：执行时重新计算，并校验分析结果是否过期。", "inputs": ["beat_data.json 或缓存的分析结果", "BGM 片段的 trim 与倍速映射", "重叠的视频片段 id"], "outputs": ["music_edit_plan：cutFrames[]、targetItemIds[]、analysisRef", "对齐后的片段时长表"], "atomic": [{"name": "只读计划", "impl": "music_edit_plan(itemId, timing, density)", "note": "timing=auto/beat/downbeat/section；上限 96 个切点、64 个目标；返回不透明 analysisRef"}, {"name": "密度映射", "impl": "sparse/medium/dense", "note": "分别取每 4/2/1 个候选点；auto 下 sparse 走 section→downbeat→beat，dense 反过来"}, {"name": "stale 校验与提交", "impl": "sync_cuts_to_music(analysisRef)", "note": "执行时按当前状态重新计算，不重放旧帧号；锁定的轨道跳过并报告；全部 split 合并成一个 EditorCommands.batch"}, {"name": "时长对齐拍格", "impl": "edit_meterial_durations_beats", "note": "按 beats_durations 累加来逼近素材时长，不足 min_clip_duration=1000ms 就继续吃掉下一拍；曲子不够长时自动循环并告警"}, {"name": "拍号常量化", "impl": "beatT(n)=SOURCE_BEAT0+OFFSET+n*BEAT_INT", "note": "镜头边界写 beatF(整数拍)，换曲只改两个常量；SFX 与画面共用同一事实源"}], "interview": "访谈里对齐节拍只是软约束。语义完整优先，句子不能为了对上节拍而被切断。", "sports": "得分和庆祝镜头可以硬性对齐 downbeat（小节第一拍），但回放段落要让位给现场解说的完整句子。", "mg": "MG 里对齐节拍是硬约束：渲染后回测每个切点误差 ≤3f 才算通过。但全画面级冲击全片 ≤3 处、间隔 ≥16 拍，逐拍切换画面会被看成抖动。", "pitfalls": [{"title": "重音钉在半拍上", "detail": "实测曾把最大 slam（重音冲击）钉在 b52.5，而最强底鼓（kick）在整数拍 b52，渲染后偏差 +5.75 帧。强鼓点曲目的重音几乎总在整数拍上，钉在半拍必须有 env 数据支持。", "source": "video-shotcraft/references/music-beat-sync.md:110"}, {"title": "稀疏重音用网格插值", "detail": "密集而规则的切点可以用网格 beatF(n)，但稀疏的重音和孤立的定格必须钉在真实瞬态上：网格的微小漂移会被单个重音放大成可感知的偏差。", "source": "video-shotcraft/references/music-beat-sync.md:166"}, {"title": "计划直接改 BGM 本身", "detail": "节拍对齐计划只作用于与 BGM 区间重叠的视频片段，绝不能包含或改动 BGM 片段本身，否则音乐会被切碎。", "source": "OpenChatCut/src/agent/skills/music-intelligence/SKILL.md:35"}, {"title": "音乐不够长静默循环", "detail": "beat_index 越界时会自动归零，只加一条 warning，成片里的音乐就会突然从头再来。必须在计划阶段就判断时长，并显式决定循环点或换曲。", "source": "FireRed-OpenStoryline/src/open_storyline/nodes/core_nodes/plan_timeline_pro.py:124"}], "refs": [{"repo": "OpenChatCut", "path": "OpenChatCut/src/agent/tools/schemas/music- 只能标记 review_rights，清权完成后才能标记 ship"}], "interview": "访谈常包含第三方素材和被访者肖像，授权记录要和音频授权分开管理，但同样是发布前置条件。", "sports": "赛事画面与现场音乐本身常有版权。BGM 完成清权不等于赛事素材清权，两者要分别记录。", "pitfalls": [{"title": "技术合格被当成可发布", "detail": "QC 只检查黑帧、削波、时长这些技术项。技术指标健康但媒体权利未解决的母版必须停在 review_rights，不能直接判 ship。", "source": "chatmonteur/docs/production-lifecycle.md:51"}, {"title": "平台条款当成开放授权", "detail": "meme/gif 库的内容附带的是平台 ToS 而不是开放许可，个人和社交用途没问题，商用不行。sidecar 必须如实记录这次调用的归属。", "source": "llm-video-maker/skills/make-video/SKILL.md:263"}, {"title": "provenance 不进 review 清单", "detail": "OpenMontage 把 provider/original_url/license 写进 asset 阶段的 review_focus，缺一条就过不了检查点。授权信息要做成流程字段，而不是口头约定。", "source": "OpenMontage/pipeline_defs/documentary-montage.yaml:109"}], "refs": [{"repo": "llm-video-maker", "path": "llm-video-maker/skills/make-video/SKILL.md", "line": 263, "why": ".credit.json sidecar 的字段与拒收规则"}, {"repo": "chatmonteur", "path": "chatmonteur/chatmonteur/tools/qc.py", "line": 88, "why": "review_rights / ship 的判定代码"}, {"repo": "chatmonteur", "path": "chatmonteur/docs/production-lifecycle.md", "line": 51, "why": "权利未清的母版不得标记 ship"}, {"repo": "OpenMontage", "path": "OpenMontage/pipeline_defs/documentary-montage.yaml", "line": 109, "why": "provenance 作为检查点的强制 review 项"}]}], "side": "right", "num": "⑦", "color": "#D65A9E"}, {"id": "packaging", "title": "字幕画幅与 MG 包装", "tag": "shared", "summary": "用真实的逐词时序做字幕，按主体裁切画幅，再叠加 MG 图形动画并逐帧验收。", "goal": "包装是成片给观众的第一印象，也是最容易出现静默错误的一层。要把字幕、画幅、图形三件事都变成可校验的确定性产物。", "inputs": ["逐词时间戳的 transcript（绝对毫秒）", "剪辑后的时间线与镜头边界", "vision pass 的 analysis.json / safe-zones.json", "品牌 brand profile 或 design system"], "outputs": ["单一可寻址的字幕 timeline（软字幕或直接烧录进画面）", "随时间变化的 crop path / vertical plan", "MG 图形层（typed props）", "lint + verify + 逐帧抽查报告"], "interview": "访谈字幕要标注说话人、保证断句质量，画幅要保住人脸，图形以画面下三分之一区域的信息条为主。", "sports": "赛事要有比分卡和人物卡，裁切必须保住记分牌与场上 UI，字幕要让位给解说。", "mg": "MG 方向包装就是内容本身，没有底层素材可叠加。字幕换成字卡和 kinetic type（动态文字），画幅在 brief 里就定死，不做 reframe。", "atomic": [{"name": "词级字幕分页", "impl": "createTikTokStyleCaptions / segmenter", "note": "按毫秒窗口把词合并成页；中文按字符单元计算预算（CJK=2、其他=1），不按词数"}, {"name": "安全区与遮挡计算", "impl": "safe-zones.cjs / analysis.json", "note": "输出 subjectBbox、faceBbox、negSpaceRect、brightness、hugLeft/hugRight 与 heroBands"}, {"name": "主体跟随裁切", "impl": "auto_reframe → builtin:zoom 关键帧", "note": "intervalFrames=15、sensitivity=0.5、smooth=0.45（EMA）、maxSamples=60"}, {"name": "镜头配方卡", "impl": "video-shotcraft 157 张卡 + Remotion demo", "note": "每卡记用途、能量、建议时长、参数表、已知坑与可复制实现"}, {"name": "编译式配方", "impl": "open-edit RecipeGenerator.generate()", "note": "generate(meta, wordTimings, {demote}) → {wv, manifest}，零 token、确定性、无运行时模型"}, {"name": "视觉 lint", "impl": "lint-template.ts → --verify → probe-qa", "note": "先做机械 lint，再由引擎重放绘制列表，检查 bounds/never-visible/occluded"}], "pitfalls": [{"title": "有词时序却按整句淡入", "detail": "实测一支 12 分钟的片子，磁盘上有 1872 个真实词时间戳，却只用来定每条字幕的进出时间，217 条字幕共用一个位置和一条 0.2s 淡入动画。字幕因此看起来像后贴上去的字幕轨，而不是片子的一部分。", "source": "open-edit/pipeline/design/captions.ts:1"}, {"title": "把 cue 时长均分给词", "detail": "任何用 cue（字幕条目）时长除以词数来推算每个词时间的做法，都会重新引入上游已经拒绝的均分错误。每个 delay 必须是转写结果里那个词自己的真实时间。", "source": "open-edit/pipeline/design/captions.ts:68"}, {"title": "一个全局裁切遮住关键信息", "detail": "横屏转竖屏时用一个全局裁切会切掉记分牌、比分、控件或演示内容。要按镜头和版式变化分段选择裁切：说话人特写可以居中 cover，含记分牌或 UI 的段落要保留更宽的画面。", "source": "OpenChatCut/src/agent/skills/livestream-to-clips/SKILL.md:104"}, {"title": "verify 通过不等于能看", "detail": "文字堆叠、粘连、幽灵叠字、浅底浅字、下沿裁切这几类失败对 --verify 完全不可见。配方必须在 ≥2 份词密度不同的内容上做逐帧人工检查才算验收。", "source": "open-edit/docs/recipe-format.md:134"}, {"title": "CSS 动画不可 seek", "detail": "渲染器按时间轴 seek 渲染，CSS keyframes 动画在预览里是对的、在渲染里是错的。光标和装饰动效要用时间轴 set 驱动，随机数要用带种子的 PRNG。", "source": "chatmonteur/skills/references/hyperframes-registry.md:46"}], "refs": [{"repo": "open-edit", "path": "open-edit/pipeline/design/captions.ts", "line": 72, "why": "词级/字级 reveal 与分页保持的完整实现"}, {"repo": "open-edit", "path": "open-edit/pipeline/director-brief.md", "line": 103, "why": "围绕主体构图、安全边距与可读性的硬规则"}, {"repo": "chatmonteur", "path": "chatmonteur/skills/subtitles.md", "line": 17, "why": "Netflix/BBC 字幕标准的可执行数值表"}, {"repo": "video-shotcraft", "path": "video-shotcraft/references/shots/typography/blur-slide.md", "line": 1, "why": "镜头配方卡的完整结构：参数表 + 已知坑"}, {"repo": "hyperframes", "path": "hyperframes/skills/embedded-captions/SKILL.md", "line": 123, "why": "安全区驱动的字幕排布与遮挡阈值"}], "children": [{"id": "subtitle-timing", "title": "字幕时序与断句", "tag": "shared", "summary": "逐词时间戳直接驱动字幕的逐词显现（reveal），分页按字符预算而不是词数。", "goal": "字幕是唯一把字和声音绑在一起的东西。时序必须来自真实转写，断句必须在语义边界，页面必须是单一可寻址的时间线。", "inputs": ["word-timings.json：每词绝对毫秒", "说话人分离结果"], "outputs": ["分页后的 caption pages（start/end/words）", "SRT / VTT / ASS 或内嵌 spans"], "atomic": [{"name": "页面合并", "impl": "combineTokensWithinMilliseconds", "note": "值越大每页词越多；示例用 1200 ms，页时长再与下一页起点取 min"}, {"name": "字符单元预算", "impl": "CJK=2、其余=1", "note": "CAPTION_MAX_CHARS_PER_LINE=24、CAPTION_MAX_VISUAL_LINES=2，溢出时改为分页，不截断文本"}, {"name": "阅读速度约束", "impl": "≤17 CPS、单条 ≥0.83 s、≤7 s", "note": "拉丁文每行 ≤42 字符，西里尔 37–39；换行在从句边界，不拆名词短语"}, {"name": "词级 reveal", "impl": "每词一 span，delay 取 delayMs 原值", "note": "逐字再叠加 34 ms 的 intra-word stagger，单字 pop 120 ms；末页结尾保留 600 ms"}, {"name": "残留清理", "impl": "LINGER_MS=1500 / 硬杀分组", "note": "每页保持显示到下一页开口为止；GSAP 路径要显式调用 tl.set(opacity:0, visibility:hidden)，否则字幕会压到下一条上"}], "interview": "访谈有多个说话人时要换行并标注说话人。ASR 识别错的词要按语义先改正再排版，不能把原始转写直接烧录进画面。", "sports": "赛事解说语速快，要优先保证专有名词、比分、数字的准确，页数宁可多也不要压缩行数。", "mg": "MG 的字幕时序来自 TTS 或用户转写的逐词时间戳。字幕层独占逐字原文，场景文案只能是 ≤6 词的提炼短语，两者不得重复。", "pitfalls": [{"title": "只渲染第一页", "detail": "一条 cue 超过一屏时只渲染第一页，会把后半句静默丢掉：那些话被转写了、被定时了，却从没显示出来。每一页都必须渲染。", "source": "open-edit/pipeline/design/captions.ts:87"}, {"title": "直接烧未清洗的转写", "detail": "原始转写没有大小写和标点，而且模型会在静音处幻觉出字幕组署名之类的句子。必须先按语义改正错词、补上标点、删掉幻觉段落，再排版烧录。", "source": "chatmonteur/skills/subtitles.md:83"}, {"title": "字幕位置压住播放器控件", "detail": "底边距要留 9% 帧高，低于 8–10% 会被 YouTube 进度条盖住。锚点固定 bottom-center，两行时第二行向上生长，字幕位置不跳动。", "source": "chatmonteur/skills/subtitles.md:37"}, {"title": "剪辑后没重取时序", "detail": "每次剪切后时序都会漂移。字幕和图形使用的转写必须取自最终版草稿，或者把词时序搬到新的对齐时间线上重新计算。", "source": "chatmonteur/skills/montage.md:145"}], "refs": [{"repo": "OpenChatCut", "path": "OpenChatCut/src/captions/types.ts", "line": 179, "why": "行长 24 单元、2 行、LINGER 1500ms 的共享常量"}, {"repo": "OpenChatCut", "path": "OpenChatCut/src/captions/segmenter.ts", "line": 7, "why": "CJK=2 的字符单元预算与中英混排规则"}, {"repo": "chatmonteur", "path": "chatmonteur/skills/subtitles.md", "line": 19, "why": "行数/行长/CPS/时长的完整数值标准"}, {"repo": "remotion-dev-skills", "path": "remotion-dev-skills/skills/remotion-captions/display-captions.md", "line": 67, "why": "createTikTokStyleCaptions 分页与 Sequence 时长计算"}, {"repo": "open-edit", "path": "open-edit/pipeline/design/captions.ts", "line": 99, "why": "光标接力与页保持到下一页开口的算法"}]}, {"id": "subtitle-render", "title": "字幕排布与烧录", "tag": "shared", "summary": "按安全区和遮挡数据摆放字幕，作为最后一层叠加，烧录进画面只在用户明确要求时做。", "goal": "字幕放错位置比字幕难看更致命。要用结构化的安全区数字决定位置，并把烧录与软字幕当成两条不同的交付路径。", "inputs": ["safe-zones.json / analysis.json", "字幕分页结果", "品牌字体与配色"], "outputs": ["带位置与样式的字幕层", "烧录进画面的成片，或独立的 SRT/VTT/ASS 文件"], "atomic": [{"name": "安全边距", "impl": "9:16 上≥11% 下≥17% 左≥6% 右≥11%；16:9 约 6% 四边内缩", "note": "无 analysis.json 时按此放，并避开画面正中（说话人所在）"}, {"name": "贴边区排布", "impl": "zones.hugLeft / hugRight", "note": "紧贴人物剪影的干净竖条区域；右侧列用 text-align:left 让文字从主体旁边开始排，放远角是兜底方案不是默认"}, {"name": "遮挡验收", "impl": "check-occlusion.cjs", "note": "单词遮挡 ≥65% 判 FAIL、≥35% WARN；整条字幕 ≥50% FAIL，hero 例外放宽到 68%"}, {"name": "可读性靠阴影", "impl": "text-shadow / drop-shadow", "note": "禁止为可读性加实心底板；作为设计元素的图形卡片例外"}, {"name": "烧录样式", "impl": "ffmpeg subtitles force_style", "note": "三套预设：hormozi（Arial Black 28/Outline3/Alignment10）、standard（20/BorderStyle4/Alignment2）、minimal（16/Alignment1/MarginL40）"}, {"name": "软字幕交付", "impl": "baocut export --to srt/vtt/mp4", "note": "同一份渲染计划同时产出烧录版和外挂字幕；未翻译的句子留空，不回退成原文"}], "interview": "访谈的人脸常在画面中央，字幕放在贴边区或画面下三分之一处，绝不能压脸。", "sports": "字幕要避开记分牌与场边广告区，比分类信息交给比分卡而不是字幕。", "mg": "MG 的字幕是贯穿全片的单一 overlay composition（独立 track、data-start=0），章节重渲染永远不动它。", "pitfalls": [{"ti epo": "OpenChatCut", "path": "OpenChatCut/src/editor/designTypes.ts", "line": 1, "why": "designStyle 即品牌规范，驱动 MG 与字幕的配色和字体。"}, {"repo": "OpenMontage", "path": "OpenMontage/styles/flat-motion-graphics.yaml", "line": 41, "why": "MG 操作手册（playbook）：spring 参数、停留时长与硬性规则。"}, {"repo": "pireel", "path": "pireel/packages/studio-frames/README.md", "line": 40, "why": "Frame 是一套完整可辨识的视听设计系统，不是加了颜色的剪辑技法。"}], "children": [{"id": "mg-scenarios", "title": "场景与产品定位", "tag": "mg", "summary": "把 MG 动效（Motion Graphics，图形动画）拆成八类交付物，并定义它与集锦工程的接口。", "goal": "先确定做哪一类：片头、章节卡、金句卡、比分卡、人物条、数据动画、产品演示、explainer（讲解型短片）整片。类别不同，引擎、时长档位和验收标准都不同。", "inputs": ["用户诉求或品牌简报", "集锦 Timeline IR 里 graphics/overlay 槽位的需求", "脚本或数据"], "outputs": ["MG 类别与时长档位", "引擎与路线选择（用现成配方 vs 自己手写）", "与集锦工程的接口约定"], "interview": "访谈需要说话人身份条（lower-third，画面下三分之一处的字幕条）、金句卡和章节卡。hyperframes 有 11 个 lt-* block 可直接安装。", "sports": "赛事需要比分卡、球员卡和数据条。registry 里没有 scorebug block，只能用 number-wheel 拼出数字。", "mg": "MG 分两种形态：包装层 ≤10s，没有旁白和叙事弧线；独立的 explainer 30–90s，有旁白、章节和结论。", "atomic": [{"name": "类别路由", "impl": "hyperframes /hyperframes 意图层 + /motion-graphics", "note": "先判断要不要检索素材：form 类的 asset_needs 为空时，直接从 plan 跳到 design。"}, {"name": "时长档位表", "impl": "clueso stats-infographic-video / kinetic-text-video", "note": "stats 类 30–60s，每场讲一个数字，全片 3–5 个；kinetic-type 类 20–40s，文字是唯一演员。"}, {"name": "包装层接口", "impl": "hyperframes talking-head-recut storyboard.json", "note": "卡片携带 startSec/endSec/zone/contentHints，底层视频完整播放。"}, {"name": "MG 作为子工程挂载", "impl": "data-composition-src 子合成 / Remotion Composition", "note": "MG 只是集锦时间线上的一个 clip（片段），不是另一个产品。"}], "pitfalls": [{"title": "把 MG 当装饰不当信息", "detail": "现象：整片是文字卡加淡入，读起来像 PPT。原因：场景只起装饰作用，不表达信息。对策：用 slideshow_risk 的六个维度各打 0–5 分，总分 ≥4.0 判 fail，禁止进入 compose。", "source": "OpenMontage/lib/slideshow_risk.py:16"}, {"title": "MG 能力被过度宣称", "detail": "现象：以为 MG 和字幕一样成熟。原因：OpenEdit 自己写明 V1 只针对 captions，motion graphics/charts/brandbook 能渲染但打磨很少。对策：MG 路径必须自带逐帧验收，不能沿用对字幕路径的信心。", "source": "open-edit/README.md:176"}, {"title": "短 MG 走了整片流程", "detail": "现象：10s 的字卡也跑了两轮 storyboard 评审。原因：没有按时长分流。对策：motion-graphics workflow 保持自治，最多问一个澄清问题，直接走 plan→design→build→verify。", "source": "hyperframes/skills/motion-graphics/SKILL.md:23"}], "refs": [{"repo": "hyperframes", "path": "hyperframes/skills/motion-graphics/SKILL.md", "line": 41, "why": "把 MG 分成 kinetic-type、stat、charts 等六类"}, {"repo": "hyperframes", "path": "hyperframes/skills/talking-head-recut/SKILL.md", "line": 3, "why": "在访谈素材上叠设计卡：lower-third、数据 callout（标注框）、引语、PiP（小窗叠加画面）。"}, {"repo": "pireel", "path": "pireel/packages/studio-frames/content/varsity-bold/frame.md", "line": 37, "why": "体育包装的两种形态：叠在画面上的 score bug（比分条）和整屏 stats board。"}, {"repo": "clueso-ai-skills", "path": "clueso-ai-skills/skills/stats-infographic-video/SKILL.md", "line": 13, "why": "数据片一场只讲一个数字，选 3–5 个数搭成论证。"}, {"repo": "OpenMontage", "path": "OpenMontage/.agents/skills/hyperframes/PROVENANCE.md", "line": 6, "why": "集锦仓库把 HyperFrames MG skill 锁定版本后内嵌。"}, {"repo": "hyperframes", "path": "hyperframes/registry/registry.json", "line": 351, "why": "registry 已有 11 个 lt-* lower-third block"}]}, {"id": "mg-script-storyboard", "title": "脚本到分镜", "tag": "mg", "summary": "把脚本、事实和章节编译成帧级分镜（逐镜头的画面计划），并支持按 chapter 局部重做。", "goal": "让分镜成为可校验、可局部重生成的 artifact，而不是一次性的 prompt 输出。分镜没有 schema 化时，任何一次改动都要全片重来。", "inputs": ["脚本 SCRIPT.md 或 script.schema.json", "facts.json（屏上事实的唯一来源）", "品牌 spec、时长与画幅（画面宽高比）约束"], "outputs": ["STORYBOARD.md / storyboard.json / scene_plan.json", "帧级时间轴与停留（hold）帧预算", "run-log.jsonl 与 checkpoint_<stage>.json"], "interview": "访谈分镜的时间基准由 transcript（逐字稿）决定：转场（镜头之间的过渡）只能落在 ≥1.5s 的呼吸间隙或段落结束后 0.3s 内。", "sports": "赛事分镜按事件链排卡片，比分卡必须与真实比分状态对齐，不能由 LLM 现编数字。", "mg": "MG 动效（Motion Graphics，图形动画）没有素材可依，分镜必须自带 status（outline→built→animated）和事实引用，否则无法判断做到哪一步。", "atomic": [{"name": "分镜 schema", "impl": "STORYBOARD.md frontmatter + 每帧 metadata", "note": "帧的字段有 status/src/duration/transition_in/voiceover，未知字段进 extra。"}, {"name": "场景状态机", "impl": "outline → built → animated", "note": "sketch 阶段只写线框 HTML 和一条空 timeline，不跑任何 CLI。"}, {"name": "章节级局部重做", "impl": "/edit-video <project> <chapter> \"<指令>\"", "note": "chapter 是最小编辑单位；v0 仍是全片重渲，逐章缓存留待后续升级。"}, {"name": "语速换算时长", "impl": "words/sec 预算", "note": "toolkit 用 2.5 词/秒；llm-video-maker 用 2.3–2.6 词/秒；中文稿按 280 字/分钟。"}], "pitfalls": [{"title": "hand-edit 归属只靠 mtime", "detail": "现象：用户手工改过的分镜被下游重跑覆盖。原因：v1 只用 mtime（文件修改时间）判断新旧。对策：重生成严格向下（brief→design→storyboard→render），只有同层或更上层可以覆盖，且必须在报告里写明。", "source": "llm-video-maker/skills/make-video/SKILL.md:66"}, {"title": "改时长被当成局部编辑", "detail": "现象：把某一段拉长导致全片时间轴错位。原因：把重生成当成了局部编辑。对策：声明时钟锁定：scene 的 start/end/duration 与 segmentIds 不可移动，改时长一律走重生成。", "source": "llm-video-maker/skills/edit-video/SKILL.md:53"}, {"title": "为过审提前渲草稿", "detail": "现象：assets 门禁通过前先渲染一版完整片给用户看。原因：想用成片换取批准。对策：assets 阶段的审阅对象是逐场素材的 filmstrip（缩略图条）；渲染完整草稿等于抢走用户该把的那道门，属于 gate violation。", "source": "OpenMontage/skills/meta/checkpoint-protocol.md:157"}, {"title": "屏上文字信息过载", "detail": "现象：一屏放五行字，观众读不完。对策：onScreen 每条文字都带 role，primary 最多 1 条；阅读负荷预算 = primary+secondary+support 的总词数 ≤ 3.5 × 场景秒数。", "source": "llm-video-maker/skills/make-video/SKILL.md:198"}], "refs": [{"repo": "hyperframes", "path": "hyperframes/skills/hyperframes-core/references/storyboard-format.md", "line": 29, "why": "帧字段与 outline/built/animated 状态机"}, {"repo": "llm-video-maker", "path": "llm-video-maker/skills/make-video/SKILL.md", "line": 63, "why": "严格向下的重生成规则与 hand-edit 归属规则。"}, {"repo": "llm-video-maker", "path": "llm-video-maker/skills/make-video/scripts/plan-scenes.mjs", "line": 26, "why": "确定性分场常量：2.5s 下限、9s 上限、1.5s 呼吸间隙"}, {"repo": "OpenMontage", "path": "OpenMontage/schemas/artifacts/scene_plan.schema.json", "line": 20, "why": "九类 scene type 与 shot_language 结构化摄影词汇。"}, {"repo": "claude-code-video-toolkit", "path": "claude-code-video-toolkit/lib/project/types.ts", "line": 15, "why": "ProjectPhase 状态机与 Scene/AssetStatus 字段名"}, {"repo": "video-agent-skills", "path": "video-agent-skills/video-agent-producer/SKILL.md", "line "HTML + Playwright 逐帧截图 + FFmpeg", "note": "1920×1080 视口、DPR 1、导航后只等 300ms 字体；按墙钟（真实流逝时间）截图，不是确定性步进。"}, {"name": "dapi CLI", "impl": "media probe/grab/filmstrip/waveform/transcribe/listen、capture、check", "note": "单条记录输出 JSON，集合输出 JSON Lines；除 fonts/fetch 外都要求 app 在运行。"}], "pitfalls": [{"title": "闭源渲染器的许可与平台限制", "detail": "编辑器是 Apache-2.0，渲染器二进制走 PolyForm Shield 1.0.0：产出的视频可商用且不付费，但不得做与 VEED 竞争的产品。只发布 macOS-arm64 与 windows-x64。", "source": "open-edit/README.md:185"}, {"title": "引擎能力表必须由探针决定", "detail": "现象：文档里写的限制其实是猜的，直接砍掉了真实能力。对策：OpenEdit 规定每条引擎限制都要有 control-render 探针加像素 diff 作证；这一节一旦漂回‘凭记忆断言’，测试会 fail build。", "source": "open-edit/pipeline/director-brief.md:188"}, {"title": "截帧法的时序会漂", "detail": "现象：动画节奏与标称 fps 对不上。原因：用 screenshot + wait_for_timeout 按墙钟时间推进，单张截图 30–50ms，1080p 下约 2–3 倍实时。对策：只用于时序不敏感的演示片。", "source": "framecraft/LEARNINGS.md:79"}, {"title": "字体等待时间自相矛盾", "detail": "现象：第 0 帧字体没加载完。原因：LEARNINGS 写明要等 500ms（Google Fonts @import 需 200–500ms），代码里却只等了 300ms。对策：自建管线时把字体就绪当成显式条件，不用固定睡眠。", "source": "framecraft/framecraft.py:369"}], "refs": [{"repo": "open-edit", "path": "open-edit/pipeline/director-brief.md", "line": 9, "why": ".wv 是 CSS 扩展，@keyframes 即时间线"}, {"repo": "open-edit", "path": "open-edit/README.md", "line": 129, "why": "不用 headless 浏览器；2.2× 提速尚不可复现"}, {"repo": "editor", "path": "editor/reference/jsx/module.md", "line": 38, "why": "每个元素带 id 并写回源码，六位 base36，是画布写回的定位锚"}, {"repo": "editor", "path": "editor/packages/runtime/src/index.ts", "line": 1, "why": "运行时是无 DOM 无 Solid 的 koota world"}, {"repo": "framecraft", "path": "framecraft/framecraft.py", "line": 360, "why": "逐帧 screenshot + wait_for_timeout 推进"}]}]}, {"id": "mg-audio", "title": "对齐节拍的配音与声音设计", "tag": "mg", "summary": "先测出节拍网格再排分镜，SFX（音效）相对镜头起点钉帧（锚定到具体帧）并补两项偏移。", "goal": "MG 动效（Motion Graphics，图形动画）一半的观感来自声音。强节奏片必须先验收节拍网格，再排分镜（逐镜头画面计划）；配音片必须让画面时长跟着实际音频走，而不是反过来。", "inputs": ["BGM 音频", "旁白脚本或已录配音", "分镜表与镜头边界"], "outputs": ["beat_data.json（bpm/t0/beats/hits/rms/sections）", "SFX 钉帧表 {from, src, volume}", "带 BGM 与无 BGM 两版成片"], "interview": "访谈字卡跟着语音走：用词级时间戳对齐，转场（镜头之间的过渡）落在 ≥1.5s 的呼吸间隙里。", "sports": "赛事集锦常用强鼓点 BGM，切点锚定拍号；但作用于全画面的冲击效果全片 ≤3 处。", "mg": "动效关键帧可以直接写成 beatF(n)，换曲时只改两个常量即可全片重排。", "atomic": [{"name": "拍子网格拟合", "impl": "librosa beat_track + 最小二乘等距拟合", "note": "不要直接信 beat_track 给出的 tempo 标量；残差 ≤±15ms 才算机器鼓点。"}, {"name": "鼓点三分类", "impl": "kick 40–160Hz / snare 150–500Hz+1–3kHz / hihat 6–14kHz", "note": "kick（底鼓）驱动冲击、snare（军鼓）驱动换镜、hihat（踩镲）决定微动密度。"}, {"name": "网格验收指标", "impl": "match ≥98% / mean_abs_ms <10ms / drift <5ms / 首拍有效", "note": "先验收再排分镜；以指标定夺，不以听感定夺。"}, {"name": "拍号写时间线", "impl": "beatF(n) = round((SOURCE_BEAT0 + OUTPUT_AUDIO_OFFSET_SEC + n*BEAT_INT)*FPS)", "note": "源分析值永远不改，渲染偏移单独记账。"}, {"name": "配音语速控制", "impl": "pacing.py atempo 保调变速", "note": "WARN_FAST 170 / WARN_SLOW 110 wpm；MIN_ATEMPO 0.85，超过就有可听伪影"}, {"name": "双版本交付", "impl": "bgm 布尔 inputProp", "note": "同一条时间线渲带 BGM 和无 BGM（保留 SFX）两版，方便用户后期自配音乐。"}], "pitfalls": [{"title": "逐拍打全画面", "detail": "现象：用户反馈‘镜头随节奏抖动，影响观感’。原因：把 kick 命中表当成触发器，每一拍都让全画面泵动。对策：命中表只是候选池；作用于整画面或相机层的冲击全片 ≤3 处、相邻间隔 ≥16 拍，其余拍点只动元素层。", "source": "video-shotcraft/references/aesthetic-rules.md:38"}, {"title": "音画对齐少补两项偏移", "detail": "现象：最重的一击晚了 0.27s。原因：音源峰值滞后与输出音轨偏移叠加在一起。对策：Sequence.from = 目标峰值帧 − 音源峰值滞后帧 − 输出音轨偏移帧，浮点运算到最后一步再取整。", "source": "video-shotcraft/references/sound-design.md:288"}, {"title": "SFX 钉绝对帧号", "detail": "现象：改一个镜头的时长，后面所有音效全部失效。对策：钉帧一律写成 SHOTS.<shot>.from + offset，需要对齐节拍的片子写 beatF(n)，新项目起手就用相对钉帧。", "source": "video-shotcraft/references/sound-design.md:282"}, {"title": "克隆音色语速修不动", "detail": "现象：反复重录仍然是 170–210 wpm。原因：克隆音色会继承参考音频的语速，temperature 改不了。对策：参考音频录 12–25s、语速正常的多样句子，并用 --max-wpm 165 做确定性变速兜底。", "source": "claude-code-video-toolkit/tools/pacing.py:3"}], "refs": [{"repo": "video-shotcraft", "path": "video-shotcraft/references/music-beat-sync.md", "line": 114, "why": "网格验收四指标与 beat_data.json 产物字段"}, {"repo": "video-shotcraft", "path": "video-shotcraft/references/sound-design.md", "line": 20, "why": ：关键帧（可独立解码的完整帧）够密，seek 才落得准；配 -t duration 而非 -to"}, {"name": "首帧封面", "impl": "0/0.5/1/2/3 秒逐次抽帧 + 黑帧判定", "note": "ClipTalk：dark_pixels/pixels≥.985 且 mean≤12 判黑"}, {"name": "联系表雪碧图", "impl": "fps=1,scale=160:-1,tile=10x5", "note": "全片按 1fps 抽检，比只抽 3 帧可靠；ClipTalk 另有 4 列雪碧图（缩略图拼成的图）"}, {"name": "旋转感知", "impl": "按 display 尺寸而非 coded 尺寸计算", "note": "montaj：手机竖拍带 rotation tag（旋转标记），重构图必须用 display（显示方向）宽高"}], "pitfalls": [{"title": "抽帧覆盖度不校验", "detail": "源文件损坏时只抽到前半段，模型却给出全片结论。ClipTalk 在帧数低于期望 85% 或最晚帧覆盖不到尾部时直接中止视觉分析并报错。", "source": "ClipTalk/app/media.py:349"}, {"title": "容器时长当成画面时长", "detail": "MP4 容器的 duration 常继承更长的音轨或 edit list，据此排时间线会多出一段没有画面的尾巴。必须取 video stream 自身的时长。", "source": "ClipTalk/app/media.py:183"}], "interview": "多台相机同时拍摄的长录音必须先测时钟漂移（录音随时间逐渐错位）；消费级设备漂移 20-500ppm，一小时可差 1.8 秒。", "sports": "导播台（现场切换设备）与球场机位（相机位置）的帧率常不一致，赛事素材必须先统一成 CFR（恒定帧率），再谈事件时间码。", "refs": [{"repo": "ClipTalk", "path": "ClipTalk/app/media.py", "line": 1595, "why": "预览代理转码的完整参数"}, {"repo": "kajisho5-ffmpeg-skill", "path": "kajisho5-ffmpeg-skill/references/devices.md", "line": 22, "why": "各类设备素材的归一化处方"}, {"repo": "montaj", "path": "montaj/docs/RENDER.md", "line": 449, "why": "关键帧 1s 与 -t 而非 -to 的理由"}]}, {"id": "atomic-speech", "title": "语音理解能力", "tag": "atomic", "summary": "词级 ASR、VAD（语音活动检测）、说话人分离、声纹，以及必备的幻觉防线", "goal": "访谈剪辑的时间轴就是词时间轴。没有词级时间戳，切点只能靠估算，必然吞字（把词切掉一截）。", "inputs": ["归一化母版音轨"], "outputs": ["word-level transcript JSON（逐词转写）", "speaker turns（说话人轮换）", "voiceprint 库"], "atomic": [{"name": "VAD", "impl": "Silero VAD ONNX / FSMN-VAD / auto-editor levels", "note": "FSMN 的 max_single_segment_time v2 用 3000ms，否则 30000ms"}, {"name": "静音切除", "impl": "auto-editor threshold=0.14, margin=0.12s,0.10s", "note": "阈值是满刻度的分数（0 到 1），只在响度归一化后有效；--sample-rate 48000 防爆音（咔哒声）"}, {"name": "说话人分离", "impl": "pyannote 3.1 / FunASR CAM++ / AssemblyAI 内置", "note": "pyannote 需 HF gated token（申请制令牌）；CAM++ merge_thr 调到 0.82，避免同一个人被拆成两个说话人"}, {"name": "声纹库", "impl": "CAM++ speech_campplus_sv_zh-cn 192 维", "note": "ClipTalk 阈值 review .31 / accept .38，库经 AES-GCM 加密"}, {"name": "幻觉过滤", "impl": "no_speech_prob>0.6 且 avg_logprob<-1.0 丢弃", "note": "幻觉句是正常语句，正则抓不到，只能用解码器自身置信度"}, {"name": "语言守卫", "impl": "language≠en 时硬阻断 *.en 模型", "note": "英文模型不拒绝其他语言，它会静默翻译，这是最像成功的失败"}, {"name": "词级反查", "impl": "helpers/find_quote.py 对缓存 transcript 检索", "note": "premiere-agent：比手写 grep 快 50-100 倍且带越界检查"}, {"name": "SRT 生成", "impl": "helpers/build_srt.py 按输出时间轴重算", "note": "禁止手写时间戳；偏移 = word.start − segment_start + segment_offset"}], "pitfalls": [{"title": "尾词 end 被标晚", "detail": "全上下文 ASR 常把最后一个词的 end 标晚 1-2 秒。据此定片尾会多出一段空镜（没有主体内容的画面），必须回源核对。", "source": "chatmonteur/skills/cutting.md:115"}, {"title": "转写没跟着剪过的片子", "detail": "每次剪切后时间轴都会变。用原始素材的 transcript 给粗剪版打字幕，字幕会整体错位。必须转写 draft（剪辑稿）而不是 raw（原始素材）。", "source": "chatmonteur/skills/references/edit-sequence.md:12"}], "interview": "说话人分离（diarization）是访谈的刚需：先分清谁在说话，再选 take（同一段内容的各次录制）；否则同一问题的多次回答分不开。", "sports": "赛事解说词是弱信号，语音族只用来抓解说情绪峰值，不能当事件真值。", "refs": [{"repo": "premiere-agent", "path": "premiere-agent/helpers/diarize.py", "line": 84, "why": "pyannote 3.1 直调与词级归属投票"}, {"repo": "ClipTalk", "path": "ClipTalk/app/voiceprint.py", "line": 21, "why": "跨视频声纹识别的模型与阈值"}, {"repo": "chatmonteur", "path": "chatmonteur/chatmonteur/tools/transcribe_whisper.py", "line": 103, "why": "幻觉过滤与语言守卫实现"}], "children": [{"id": "atomic-word-asr", "title": "词级 ASR 各家对比", "tag": "atomic", "summary": "八套 ASR 实现的部署形态与输出格式差异", "goal": "词级时间戳的质量直接决定切点质量。各家在幻觉、语种、显存、许可证上的表现差异很大，必须按场景选。", "outputs": ["words[] 含 start/end/text/confidence"], "atomic": [{"name": "ElevenLabs Scribe", "impl": "scribe_v1 REST，diarize=true，word 粒度", "note": "video-use 在用；云端服务，需 API key；时间戳有 50-100ms 漂移，靠 padding（前后留余量）吸收"}, {"name": "Parakeet TDT 0.6B", "impl": "onnx-asr，EP 阶梯 TensorRT/CUDA/DirectML/CPU", "note": "premiere-agent 的默认；本地运行；v2 只支持英文，v3 支持多语种，自动路由"}, {"name": "WhisperX", "impl": "whisperx CLI，small.en，cpu/int8", "note": "open-edit 的默认档（tier）；对齐后输出词级时间戳，OpenMontage 也在用"}, {"name": "faster-whisper", "impl": "WhisperModel word_timestamps=True", "note": "chatmonteur 与 OpenMontage 的免费默认；优先 CUDA float16，不可用则回退 CPU int8"}, {"name": "SenseVoiceSmall", "impl": "FunASR iic/SenseVoiceSmall", "note": "ClipTalk 在用；只输出句级时间戳，但带 emotion 与 audio_event 富标签（情绪与声音事件）"}, {"name": "mlx_whisper", "impl": "mlx-community/whisper-large-v3-turbo", "note": "video-edit-cli 在用；Apple Silicon 本地运行，开 word_timestamps=True"}, {"name": "whisper.cpp / transformers.js", "impl": "ggml q5 与 onnx-community timestamped 双轨", "note": "OpenChatCut 把 repo 与 revision 锁死，并用 sizeBytes 校验文件"}, {"name": "qwen3-asr", "impl": "本地 0.6b/1.7b 或 DashScope filetrans 云端", "note": "baocut 支持 remote node（远程节点）；OpenMontage 云端版需要公网可访问的 https audio_url"}], "pitfalls": [{"title": "Whisper 被整体弃用", "detail": "premiere-agent 代码库里根本没有 Whisper 后端：静音幻觉，加上词级时间戳带来的显存回退（占用更多显存），会让长片跑崩。长视频场景优先考虑 Parakeet。", "source": "premiere-agent/AGENT.md:86"}, {"title": "长源重复循环幻觉", "detail": "跨窗口的 context 在难解码的段落（音乐、进球回放）塌陷后，同一句话会一直重复到文件结尾。传 --max-context 0 可以切断这种跨窗口传染。", "source": "montaj/skills/SKILL.md:88"}], "refs": [{"repo": "premiere-agent", "path": "premiere-agent/SKILL.md", "line": 86, "why": "双 speech lane（语音通道）字节级同构的输出契约"}, {"repo": "video-edit-cli", "path": "video-edit-cli/src/video_editor/transcription/base.py", "line": 19, "why": "唯一干净的 ASR provider Protocol"}]}]}, {"id": "atomic-vision", "title": "视觉理解能力", "tag": "atomic", "summary": "镜头切分、VLM caption（画面描述）、质量分、OCR、人物识别、视觉向量", "goal": "赛事和无对白素材没有文本入口，只能靠视觉建证据层。关键是用稀疏但多视角的采样控制成本。", "inputs": ["归一化母版", "shot 边界"], "outputs": ["shot list（镜头清单）", "caption 时间线", "visual-embeddings.npy", "person/face 索引"], "atomic": [{"name": "神经网络镜头切分", "impl": "TransNetV2 PyTorch，输入 27×48×3", "note": "FireRed：阈值 0.5，最短镜头 1000ms，权重放 .storyline/models"}, {"name": "像素差镜头切分", "impl": "PySceneDetect ContentDetector 或 ffmpeg scdet", "note": "ffmpeg 用 gt(scene,0.3)；PySceneDetect：人物讲话特写 22、通用 27、录屏 30"}, {"name": "VLM caption 本地", "impl": "Florence-2-base <MORE_DETAILED_CAPTION> @1fps", "note": "premiere-agent 用 florence-community 移植版绕开 MS Research License"}, {"name": "caption 压缩", "impl": "spaCy 去虚词 + 句级模糊去重 + 静止帧折叠", "note": "merged_timeline token 降 55-60%，缓变帧只出新增句"}, {"name": "审美与质量分", "impl": "aes_score 四维 / PIL ImageStat 亮度锐度", "note": "ClipTalk：黑帧 brightness<.08，模糊 sharpness<.025，灰度降到 80×45"}, {"name": "OCR", "impl": "PaddleOCR 3.7.0", "note": "ClipTalk 全量档 2FPS，均衡档降 1FPS 并封顶 300 帧；体量与许可需评估"}, {"name": "人脸检测识别", "impl": "OpenCV Zoo YuNet + SFace ONNX", "note": "FaceDetectorYN 320×320，score .9，nms .3，topK 5000"}, {"name": "人体检测与 ReID", "impl": "YOLOX + YoutuReID ONNX", "note": "ClipTalk 引擎标识 yolox-youtureid-sface-anchor-v3，走独立的 0.25s 密流（每 0.25 秒一帧的密集帧流）"}, {"name": "视觉 embedding", "impl": "SigLIP2 / chinese-CLIP / CLIP ViT-B-32 / SigLIP", "note": "frontstage 是唯一端侧按画面搜镜头；模型换版会让索引整体失效"}, {"name": "开放词表检测", "impl": "GroundingDINO", "note": "开放词表指可用任意文字描述要检测的目标；ClipTalk box 与 text 同阈值 0.3；可用于赛事器材与球门检测"}], "pitfalls": [{"title": "SigLIP 判不了谁在说话", "detail": "通用帧向量只表达画面语义，不含口型与音画对应。用它做 face↔speaker 关联会把人认错，ClipTalk 显式禁止这条推断。", "source": "ClipTalk/app/main.py:8081"}, {"title": "人物识别拖垮全局帧率", "detail": "人物识别要求穷尽覆盖，若与视觉 embedding 共用帧流，会把所有视觉任务都拉到 2FPS。ClipTalk 给它单独开一条密流隔离开。", "source": "ClipTalk/app/recognition_pipeline.py:226"}], "interview": "访谈视觉族只需低频 caption 来找机位（相机位置）切换和空镜（无人物的过渡画面），主战场仍是词时间轴。", "sports": "赛事必须开 OCR 读记分牌与时钟，并用人体 ReID（跨镜头认出同一人）跟踪球员；这是唯一能识别回放的信号。", "refs": [{"repo": "premiere-agent", "path": "premiere-agent/helpers/visual_lane.py", "line": 47, "why": "Florence-2 许可证规避与 1fps 抽帧"}, {"repo": "FireRed-OpenStoryline", "path": "FireRed-OpenStoryline/src/open_storyline/nodes/core_nodes/split_shots.py", "line": 36, "why": "TransNetV2 阈值与最短镜头长度"}, {"repo": "ClipTalk", "path": "ClipTalk/app/recognition_pipeline.py", "line": 209, "why": "分档抽帧预算的真实注释"}]}, {"id": "atomic-audio-music", "title": "音频事件与音乐", "tag": "atomic", "summary": "CLAP 声音事件、beat/downbeat（节拍与重拍）、能量曲线、ducking 与响度控制", "goal": "赛事高光的第一召回信号是声音；BGM 卡点（让剪辑点对齐节拍）需要 beat 网格。两者都必须在本地运行，而且都只是提示，不是判据。", "inputs": ["母版音轨", "本地 BGM 库"], "outputs": ["audio events（声音事件）时间线", "beatgrid JSON", "loudness（响度）曲线", "选定 BGM"], "atomic": [{"name": "CLAP 零样本事件", "impl": "LAION CLAP HTSAT via ONNX Runtime", "note": "premiere-agent 用约 10s 窗口；agent 自写 200-1000 个标签并含负样本（明确不是该类声音），缓存文本向量"}, {"name": "SenseVoice 富标签", "impl": "FunASR 输出 emotion 与 audio_event", "note": "ClipTalk 从句级结果里解析，成本几乎为零，可当粗召回（第一遍筛选）"}, {"name": "beat / downbeat", "impl": "Beat This ONNX 或 librosa beat_track", "note": "Beat This sr=22050，mel 128，chunk 1500 帧，边界 6 帧丢弃"}, {"name": "强拍筛选", "impl": "librosa percussive + 局部归一 + 峰值抑制", "note": "FireRed：top_pct=70, min_sep_beats=1, local_norm_win=8 拍"}, {"name": "动态范围", "impl": "librosa RMS 转 dB，P95 减 P10", "note": "动态范围指音量起伏大小；FireRed 用它判断 BGM 是否够激烈；sr=22050, hop=2048"}, {"name": "响度曲线", "impl": "ffmpeg -af ebur128 解析 M 值", "note": "OpenMontage 每 100ms 取一个点，能量门限默认 −40 LUFS（响度单位）"}, {"name": "静音检测", "impl": "silencedetect n=−36/−40/−45dB:d=0.3~0.5", "note": "各仓库阈值不同；ClipTalk −36dB，video-edit-cli −40dB，review 探针 −45dB"}, {"name": "ducking", "impl": "sidechaincompress 由人声做 key", "note": "ducking 指人声出现时自动压低音乐；chatmonteur th=0.05 ratio=2 attack=20 release=700，只压 2-6dB"}, {"name": "两遍 loudnorm", "impl": "print_format=json 测量后带 measured_* 应用", "note": "目标 −14 LUFS / −1 dBTP（真峰值）；播客 −16，广播 −23"}, {"name": "BGM 语义召回", "impl": "LangChain FAISS + all-MiniLM-L6-v2", "note": "FireRed 用本地模型目录，query_top_n 默认 32，召回后再交 LLM 选唯一一首"}], "pitfalls": [{"title": "只看 LUFS 不看真峰", "detail": "做过响度归一化的音频仍可能削顶（音量超上限被截平）。响度合格不等于没有削波，必须同时检查 true peak（真实峰值）。kajisho5 的 check.py 两个都测。", "source": "kajisho5-ffmpeg-skill/SKILL.md:179"}, {"title": "把环境音抬到人声电平", "detail": "测得 −40 LUFS 以下的片段是房间底噪或风声，抬高 25dB 抬的是噪声不是内容。应保留原电平并明确说明。", "source": "kajisho5-ffmpeg-skill/SKILL.md:180"}, {"title": "amix 默认会衰减对白", "detail": "amix 不写 normalize=0 时，每多一层输入对白就被静默衰减约 6dB。混 BGM 必须显式关掉归一化。", "source": "chatmonteur/skills/references/engineering-facts.md:19"}], "interview": "访谈只需 ducking 与响度处理；beat 网格基本用不上，硬让剪辑点对齐节拍会切碎语义。 p> / Premiere Time Remap", "note": "premiere-agent 速度上限 1000%，用于把长时段压成延时（timelapse 快放）画面"}], "pitfalls": [{"title": "opacity 轨被静默忽略", "detail": "ffmpeg 通过 colorchannelmixer 施加 alpha，其 aa 选项声明为 double 字面量，不接受表达式。逐帧 opacity 因此在渲染器、预览、抽帧三处都被整条忽略。", "source": "montaj/docs/RENDER.md:190"}, {"title": "无损剪切丢视频流", "detail": "seek 点不落在关键帧（可独立解码的帧）时，-c copy（不重编码直接拷贝）裁剪会静默丢掉视频流，或只留下卡住不动的静止画面。工具箱因此把重编码设为剪切的默认路径。", "source": "claude-code-video-toolkit/_internal/reviews/ffmpeg-review.md:68"}, {"title": "帧率采样率混拼", "detail": "不同帧率或采样率的文件在一次 cut.py --segments 合并中不重编码地混用会产生音画不同步，必须加 --accurate。", "source": "kajisho5-ffmpeg-skill/SKILL.md:197"}], "interview": "访谈最常用 trim + 30ms fade + J/L cut（声音先于或晚于画面切换的剪法）+ 响度；reframe 只在出竖版切片时用。", "sports": "赛事需要慢放、时间重映射和多机位（多台相机）切换；J/L cut 在长时间线上会累积音频漂移。", "refs": [{"repo": "kajisho5-ffmpeg-skill", "path": "kajisho5-ffmpeg-skill/references/scripts.md", "line": 44, "why": "cut 容差与自动重编码规则"}, {"repo": "video-use", "path": "video-use/SKILL.md", "line": 24, "why": "30ms 音频淡入淡出的完整公式"}, {"repo": "montaj", "path": "montaj/skills/SKILL.md", "line": 113, "why": "trim spec 数据抽象，可作为 IR 参考"}]}, {"id": "atomic-render", "title": "渲染与合成", "tag": "atomic", "summary": "FFmpeg、Remotion、HyperFrames、MoviePy 的分工与确定性", "goal": "编辑工程格式必须高于渲染器。Timeline IR 经 compiler 分别产出各后端任务，换后端不应改变用户工程。", "inputs": ["Timeline IR（时间线中间表示）"], "outputs": ["final.mp4", "透明 overlay（带透明通道的叠加层）", "预览帧"], "atomic": [{"name": "FFmpeg 主链", "impl": "libx264 -crf 18 -preset veryslow -movflags +faststart -pix_fmt yuv420p", "note": "yuv420p 是 QuickTime 与多数消费播放器的硬性要求；CRF ±6 约等于码率减半或翻倍"}, {"name": "Remotion", "impl": "React 组件化 MG，useCurrentFrame + interpolate", "note": "CSS transition/animation 与 Tailwind 动画类不可 seek（无法跳到任意帧），必须重写"}, {"name": "HyperFrames", "impl": "HTML/CSS/GSAP → 确定性 MP4，可 --docker byte-identical", "note": "每帧都是一次全新 seek（随机跳帧）；禁 Date.now、未设种子的 random、repeat:-1"}, {"name": "MoviePy", "impl": "CompositeVideoClip 手放少量叠加", "note": "必须显式给 size=(W,H)；VideoFileClip 默认带音频，不调 without_audio 会吞掉
